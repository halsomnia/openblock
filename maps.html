<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Toko NSI</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --blue: #1a73e8;
      --blue-dark: #1765cc;
      --gray-100: #f1f3f4;
      --gray-300: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
      --shadow-1: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2: 0 1px 3px rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .app { position: relative; height: 100vh; width: 100vw; }
    #map { position: absolute; inset: 0; z-index: 0; background: #e8eaed; }

    /* Floating panel, top-left, like Google Maps search + results */
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 380px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: var(--shadow-1);
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 6px 8px 6px 20px;
      gap: 8px;
      position: relative;
      flex-shrink: 0;
    }
    .search-card .icon { font-size: 18px; color: var(--text-secondary); flex-shrink: 0; }
    #inputWrap {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 0;
    }
    #chips { display: contents; }
    .chip {
      background: var(--gray-100);
      color: var(--text);
      border-radius: 16px;
      padding: 5px 8px 5px 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .chip .remove {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chip .remove:hover { background: var(--gray-300); }
    #search {
      flex: 1;
      min-width: 90px;
      height: 32px;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
    }
    #search::placeholder { color: var(--text-secondary); }
    #searchBtn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }
    #searchBtn:hover { background: var(--gray-100); }
    #clearChipsBtn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    #clearChipsBtn:hover { background: var(--gray-100); }

    /* Baris chip mode Produk/Toko — selalu terlihat tepat di bawah search
       bar, independen dari kotak pencarian (kotak tetap bisa diketik bebas
       kapan saja, chip tidak menonaktifkan/menutupnya). */
    .mode-chip-row {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .mode-chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--gray-300);
      border-radius: 20px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-1);
    }
    .mode-chip:hover { background: var(--gray-100); }
    .mode-chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* Tombol & panel "Fitur" — daftar pilihan fitur tambahan (on/off),
       terpisah dari chip Produk/Toko supaya bisa berkembang tanpa
       mengganggu tampilan default. */
    .feature-btn {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--gray-300);
      border-radius: 20px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-1);
      flex-shrink: 0;
    }
    .feature-btn:hover { background: var(--gray-100); }
    .feature-btn.has-active { border-color: var(--blue); color: var(--blue); }
    .feature-btn .badge {
      background: var(--blue);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 6px;
      line-height: 1.4;
    }

    .feature-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-2);
      padding: 6px;
      flex-shrink: 0;
    }
    .feature-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 8px 10px 4px;
    }
    .feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 8px;
    }
    .feature-row:hover { background: var(--gray-100); }
    .feature-text { min-width: 0; }
    .feature-title { font-size: 13px; font-weight: 500; }
    .feature-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.35; }

    /* iOS-style on/off switch */
    .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--gray-300);
      transition: background-color .2s ease;
      border-radius: 22px;
    }
    .switch .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff;
      transition: transform .2s ease;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .switch input:checked + .slider { background-color: var(--blue); }
    .switch input:checked + .slider:before { transform: translateX(16px); }

    /* Legenda heatmap — muncul di pojok kiri-bawah peta selama fitur
       "Kepadatan Toko" aktif, terlepas dari heatmap-nya sendiri sedang
       tampil atau sedang digantikan dot di zoom dekat. */
    .heatmap-legend {
      position: absolute;
      left: 12px;
      bottom: 24px;
      z-index: 500;
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow-1);
      padding: 8px 12px;
      pointer-events: none;
    }
    .heatmap-legend-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }
    .heatmap-legend-bar {
      width: 120px;
      height: 10px;
      border-radius: 4px;
      border: 1.5px solid rgba(0,0,0,0.25);
      background: linear-gradient(to right, #1a73e8, #22c1c3, #7ed957, #fbbc04, #ea4335);
    }
    .heatmap-legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* Kartu ringkasan per kota — statistik hasil pencarian, di luar peta */
    .city-summary-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-1);
      padding: 14px 16px 6px;
      flex-shrink: 0;
      max-height: 42vh;
      overflow-y: auto;
    }
    .city-summary-header {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .city-summary-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .city-summary-sub b { color: var(--text); font-weight: 500; }
    .city-summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .city-summary-rank {
      width: 16px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
    }
    .city-summary-name {
      font-size: 13px;
      width: 108px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .city-summary-bar-wrap {
      flex: 1;
      background: var(--gray-100);
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      min-width: 24px;
    }
    .city-summary-bar {
      height: 100%;
      background: var(--blue);
      border-radius: 6px;
      transition: width .3s ease;
    }
    .city-summary-count {
      font-size: 12px;
      font-weight: 600;
      width: 66px;
      text-align: right;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .city-summary-total {
      margin-top: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--gray-100);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }
    .city-summary-empty {
      padding: 10px 0 16px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--gray-100);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--gray-100); }

    /* Results card list, sits below the search bar */
    .results-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .result-header-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--gray-100);
      flex-shrink: 0;
    }
    #resultCount {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      min-width: 0;
    }
    .sheet-handle { display: none; }
    @keyframes handleBounceHint {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .sheet-header.hint-bounce .sheet-handle {
      animation: handleBounceHint 0.6s ease-in-out 3;
    }
    #sheetHintText {
      display: none;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding-bottom: 4px;
      transition: opacity 0.4s ease;
    }
    .link-btn {
      color: var(--blue);
      cursor: pointer;
      font-weight: 500;
    }
    .link-btn:hover { text-decoration: underline; }
    .suggestion-group-label {
      padding: 8px 16px 2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    #results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #results:empty { display: none; }

    .toko-item {
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--gray-100);
      transition: background 0.15s ease;
    }
    .toko-item:last-child { border-bottom: none; }
    .toko-item:hover { background: var(--gray-100); }
    .toko-item .row { display: flex; align-items: center; gap: 8px; }
    .toko-item .title { font-size: 15px; font-weight: 500; flex: 1; line-height: 1.3; }
    .toko-item .addr { color: var(--text-secondary); font-size: 13px; margin: 6px 0; line-height: 1.4; padding-left: 26px; }
    .toko-item .prod { color: var(--blue); font-size: 13px; padding-left: 26px; }

    /* Navigation button inside the Leaflet popup (replaces the old plain link) */
    .popup-nav-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
    }
    .popup-nav-btn:hover { background: var(--blue-dark); }

    .empty-state {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--gray-300);
      border-top: 4px solid var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 14px; color: var(--text-secondary); text-align: center; }
    #loadingText button {
      margin-top: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      cursor: pointer;
    }
    .progress-bar {
      width: 220px;
      height: 4px;
      background: var(--gray-300);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 14px;
    }
    .progress { height: 100%; background: var(--blue); width: 0%; transition: width 0.2s ease; }

    /* Small screens: Google Maps mobile style — search bar spans the top,
       results become a draggable bottom sheet that can be swiped to minimize/expand. */
    @media (max-width: 768px) {
      .panel {
        left: 8px;
        right: 8px;
        width: auto;
        top: 8px;
        max-height: none;
        display: block;
        gap: 10px;
      }
      /* Search bar & chip mode terlalu nempel di layar sempit — kasih
         lebih banyak ruang napas (padding/gap) supaya lebih enak disentuh
         jari dan tidak terasa berdesakan. */
      .search-card {
        padding: 8px 10px 8px 18px;
        gap: 10px;
        min-height: 52px;
      }
      #inputWrap { gap: 8px; }
      .chip { padding: 7px 10px 7px 14px; }
      .mode-chip-row { gap: 10px; }
      .mode-chip { padding: 10px 14px; }
      .results-card {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        height: 85vh;
        max-height: 85vh;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -2px 12px rgba(60,64,67,.2);
        z-index: 700;
        touch-action: none;
      }
      .sheet-header {
        flex-shrink: 0;
        cursor: grab;
        touch-action: none;
        user-select: none;
        /* Area pegangan diperbesar (min-height + padding) supaya jari tidak
           perlu presisi menyentuh garis kecil — seluruh area ini bisa
           di-tap (buka/tutup) atau ditarik (geser bebas). */
        min-height: 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6px 0;
      }
      .sheet-handle {
        display: block;
        width: 44px;
        height: 5px;
        background: var(--gray-300);
        border-radius: 3px;
        margin: 6px auto;
      }
      .sheet-header:active .sheet-handle { background: var(--text-secondary); }
      .result-header-row { padding: 12px 16px; }
      #results { touch-action: pan-y; }
    }
    #exitToast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: rgba(32,33,36,.92);
      color: #fff;
      padding: 10px 10px 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      z-index: 2000;
      box-shadow: var(--shadow-1);
      white-space: nowrap;
      align-items: center;
      gap: 10px;
    }
    #exitToastBtn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      cursor: pointer;
      background: rgba(255,255,255,.16);
      color: #fff;
      flex-shrink: 0;
    }
    #exitToastBtn:hover { background: rgba(255,255,255,.28); }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>
    <div class="heatmap-legend" id="heatmapLegend" style="display:none;">
      <div class="heatmap-legend-title">Kepadatan Toko</div>
      <div class="heatmap-legend-bar"></div>
      <div class="heatmap-legend-labels"><span>Jarang</span><span>Padat</span></div>
    </div>

    <div class="panel">
      <div class="search-card">
        <div id="inputWrap">
          <div id="chips"></div>
          <input type="text" id="search" placeholder="Cari toko atau produk..." autocomplete="off">
        </div>
        <button id="clearChipsBtn" title="Hapus semua produk terpilih" aria-label="Hapus semua produk terpilih" style="display:none;">🗑</button>
        <button id="searchBtn" title="Cari" aria-label="Cari">🔍</button>
      </div>
      <div class="mode-chip-row">
        <button type="button" class="mode-chip" id="modeChipProduk" onclick="switchChipMode('produk')">🎨 Produk</button>
        <button type="button" class="mode-chip active" id="modeChipToko" onclick="switchChipMode('toko')">🏪 Toko</button>
      </div>

      <button type="button" class="feature-btn" id="featureToggleBtn" onclick="toggleFeaturePanel()">
        ⚙️ Fitur <span id="featureActiveBadge" class="badge" style="display:none;">1</span>
      </button>
      <div class="feature-panel" id="featurePanel" style="display:none;">
        <div class="feature-panel-title">Pilihan Fitur</div>
        <div class="feature-row">
          <div class="feature-text">
            <div class="feature-title">📊 Ringkasan per Kota</div>
            <div class="feature-desc">Tampilkan jumlah toko per kota.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggleCitySummary" onchange="onFeatureToggle('citySummary', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature-row">
          <div class="feature-text">
            <div class="feature-title">🔥 Kepadatan Toko</div>
            <div class="feature-desc">Menampilkan wilayah yang padat atau kosong.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggleHeatmap" onchange="onFeatureToggle('heatmap', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="city-summary-card" id="citySummaryCard" style="display:none;"></div>

      <div class="results-card" id="resultsCard">
        <div class="sheet-header" id="sheetHeader">
          <div class="sheet-handle"></div>
          <div id="sheetHintText">Tarik ke atas untuk lihat daftar toko</div>
          <div class="result-header-row" id="resultHeaderRow">
            <div id="resultCount"></div>
          </div>
        </div>
        <div id="results"></div>
      </div>
    </div>

    <div id="exitToast">
      <span>Tekan sekali lagi untuk keluar</span>
      <button type="button" id="exitToastBtn">Keluar</button>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <p id="loadingText">Memuat daftar produk...</p>
      <div class="progress-bar"><div id="progress" class="progress"></div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>
    let map, markerLayer, heatLayer;
    // Ambang zoom transisi heatmap <-> dot. Di bawah ini ("zoom jauh",
    // level provinsi/kota besar): heatmap tampil, dot disembunyikan — dot
    // di zoom ini akan saling tumpuk dan tidak terbaca. Di angka ini ke
    // atas ("zoom dekat", level kecamatan/jalan): heatmap otomatis
    // memudar/hilang, dot individual muncul lagi seperti biasa.
    const HEATMAP_ZOOM_THRESHOLD = 13;
    // currentStores: hasil render aktif saat ini (SEMUA toko yang cocok
    // dengan filter, urut sama seperti daftar di panel). Tiap entri punya
    // slot `marker` yang diisi belakangan (lazy) hanya kalau titiknya
    // sedang terlihat di layar — supaya jumlah objek marker aktif di peta
    // tidak pernah lebih banyak dari yang benar-benar tampak.
    let currentStores = [];
    let allData = [];
    let selectedProducts = new Set();
    // Fitur tambahan (on/off), tersimpan supaya pilihan user tidak hilang
    // saat halaman dibuka lagi. Kalau semua fitur off, tampilan kembali
    // ke default (daftar toko/produk biasa, tanpa panel tambahan apa pun).
    let features = { citySummary: false, heatmap: false };
    let storeList = [];           // nama-nama toko unik, untuk autocomplete
    let currentMode = 'none';     // 'none' | 'search' | 'all'
    let chipMode = 'toko';        // 'produk' | 'toko' — chip aktif terakhir,
                                   // menentukan tampilan default saat kotak
                                   // pencarian kosong & tidak ada filter chip.
    let productList = [

    function toRad(deg) { return deg * Math.PI / 180; }

    // Jarak haversine (km) antara dua titik koordinat.
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Kota terdekat dari sebuah koordinat toko, berdasarkan titik pusat
    // kota/kabupaten yang sudah didaftar di CITY_POINTS.
    function nearestCity(lat, lng) {
      let best = null, bestDist = Infinity;
      for (const c of CITY_POINTS) {
        const d = haversineKm(lat, lng, c.lat, c.lng);
        if (d < bestDist) { bestDist = d; best = c.name; }
      }
      return best || 'Tidak diketahui';
    }

    // Merender (atau menyembunyikan) kartu ringkasan per kota. Dipanggil
    // setiap kali daftar toko dirender ulang, supaya statistiknya selalu
    // mengikuti hasil/filter yang sedang tampil. Kalau fiturnya sedang
    // OFF, kartu selalu disembunyikan (kembali ke tampilan default).
    // Memendekkan "Kabupaten" -> "Kab." khusus untuk label yang ditampilkan
    // di kartu ringkasan per kota (nama lengkap tetap dipakai di atribut
    // title, jadi masih terbaca lengkap saat di-hover). Nama kota/kotamadya
    // yang tidak diawali "Kabupaten" tidak berubah.
    function singkatNamaKota(nama) {
      return nama.replace(/^Kabupaten\s+/, 'Kab. ');
    }

    function updateCitySummary(storesValid, label) {
      const card = document.getElementById('citySummaryCard');
      if (!features.citySummary) {
        card.style.display = 'none';
        return;
      }
      if (!storesValid.length) {
        card.style.display = 'block';
        card.innerHTML = `
          <div class="city-summary-header">📊 Ringkasan per Kota</div>
          <div class="city-summary-empty">Belum ada toko untuk diringkas pada tampilan ini.</div>`;
        return;
      }

      const counts = new Map();
      storesValid.forEach(store => {
        const kota = nearestCity(store.lat, store.lng);
        counts.set(kota, (counts.get(kota) || 0) + 1);
      });

      const rows = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
      const maxCount = rows[0][1];
      const total = storesValid.length;

      let rowsHtml = '';
      rows.forEach(([kota, jumlah], i) => {
        const pct = Math.max(6, Math.round((jumlah / maxCount) * 100));
        rowsHtml += `
          <div class="city-summary-row">
            <div class="city-summary-rank">${i + 1}</div>
            <div class="city-summary-name" title="${escapeHtml(kota)}">${escapeHtml(singkatNamaKota(kota))}</div>
            <div class="city-summary-bar-wrap"><div class="city-summary-bar" style="width:${pct}%"></div></div>
            <div class="city-summary-count">${jumlah} toko</div>
          </div>`;
      });

      card.style.display = 'block';
      card.innerHTML = `
        <div class="city-summary-header">📊 Ringkasan per Kota</div>
        <div class="city-summary-sub">${label ? escapeHtml(label) : ''}</div>
        ${rowsHtml}
        <div class="city-summary-total"><span>Total</span><span>${total} toko · ${rows.length} kota</span></div>`;
    }

    function initMap() {
      // preferCanvas: semua marker vektor (circleMarker) digambar di satu
      // <canvas>, bukan sebagai elemen DOM terpisah per toko. Ini yang
      // membuat pan/zoom tetap mulus walau titiknya ratusan-ribuan,
      // karena browser tidak perlu reflow/repaint ratusan elemen DOM
      // setiap kali peta digeser/di-zoom.
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([-6.92, 107.61], 11);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      // PENTING: tidak pakai marker cluster. Semua titik toko harus selalu
      // tampil satu per satu di peta, berapa pun jumlahnya dan di zoom
      // berapa pun — tidak boleh "dijumlahkan"/dikelompokkan jadi satu
      // angka bulat saat zoom out. Ini perilaku default aplikasi.
      //
      // Sebagai gantinya, performa dijaga lewat 2 hal:
      // 1) Marker dibuat sebagai L.circleMarker (canvas) alih-alih
      //    L.marker (DOM/gambar) — lihat renderVisibleMarkers().
      // 2) Viewport culling: hanya marker yang berada di area peta yang
      //    sedang terlihat (+ buffer) yang benar-benar ditambahkan ke
      //    layer; sisanya baru dibuat saat area itu masuk layar. Daftar
      //    toko di panel tetap menampilkan SEMUA hasil, tidak dipotong —
      //    yang di-cull cuma titik di peta, bukan datanya.
      markerLayer = L.layerGroup();
      map.addLayer(markerLayer);

      // Layer heatmap (Leaflet.heat) — dibangun dari currentStores lewat
      // rebuildHeatmapLayer(), tapi baru ditambahkan/dilepas dari peta oleh
      // updateHeatmapDisplay() sesuai status fitur & level zoom. Belum
      // ditambahkan ke peta di sini karena defaultnya fitur ini off.
      heatLayer = L.heatLayer([], {
        radius: 28,
        blur: 15,
        maxZoom: 17,
        minOpacity: 0.45,
        gradient: { 0.2: '#1a73e8', 0.4: '#22c1c3', 0.6: '#7ed957', 0.8: '#fbbc04', 1.0: '#ea4335' }
      });

      let viewportRenderTimer = null;
      map.on('moveend zoomend', () => {
        clearTimeout(viewportRenderTimer);
        viewportRenderTimer = setTimeout(renderVisibleMarkers, 120);
      });

      // Transisi heatmap <-> dot murni berdasarkan level zoom peta —
      // dipisah dari listener di atas (tidak di-debounce) supaya beralihnya
      // langsung terasa responsif begitu zoom berhenti berubah.
      map.on('zoomend', updateHeatmapDisplay);
    }

    async function loadData() {
      const overlay = document.getElementById('loadingOverlay');
      const progressBar = document.getElementById('progress');
      const loadingText = document.getElementById('loadingText');

      overlay.style.display = 'flex';

      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += 22 + Math.random() * 18;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
      }, 65);

      try {
        // Pakai localStorage (bukan sessionStorage) supaya data tetap ada
        // walau halaman benar-benar tertutup (misal karena tidak sengaja
        // tekan back) dan dibuka lagi — tidak perlu fetch ulang dari nol.
        // Dikasih masa berlaku supaya datanya tidak jadi basi selamanya.
        const CACHE_MAX_AGE = 30 * 60 * 1000; // 30 menit
        const cacheRaw = localStorage.getItem('nsiData');
        const cacheTime = parseInt(localStorage.getItem('nsiDataTime') || '0', 10);
        const cacheMasihValid = cacheRaw && (Date.now() - cacheTime < CACHE_MAX_AGE);

        if (cacheMasihValid) {
          allData = JSON.parse(cacheRaw);
        } else {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 detik
          const res = await fetch(
            "https://script.google.com/macros/s/AKfycbw6VkzkHTAhyCGlmEBK_WaSO3DVzJGF3Vl95k8MTCtDIsa_zsZ1C0FBHAte74Lj7EEb2Q/exec",
            { signal: controller.signal }
          );
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          allData = await res.json();
          if (!Array.isArray(allData)) throw new Error('Format data tidak valid');
          localStorage.setItem('nsiData', JSON.stringify(allData));
          localStorage.setItem('nsiDataTime', String(Date.now()));
        }

        // Bangun daftar produk secara dinamis dari data, sebagai tambahan
        // terhadap daftar bawaan, supaya produk baru di sheet otomatis muncul.
        const produkDariData = new Set(
          allData.map(r => (r.produk || '').trim()).filter(Boolean)
        );
        produkDariData.forEach(p => {
          if (!productList.includes(p)) productList.push(p);
        });
        productList.sort((a, b) => a.localeCompare(b, 'id'));

        // Daftar nama toko unik, dipakai untuk autocomplete saat user
        // mengetik nama toko (bukan cuma nama produk).
        storeList = Array.from(new Set(
          allData.map(r => (r.pelanggan || '').trim()).filter(Boolean)
        )).sort((a, b) => a.localeCompare(b, 'id'));

        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        loadingText.textContent = "Data siap ✅";

        setTimeout(() => {
          overlay.style.display = 'none';
          // Tampilkan daftar default (sesuai chip aktif) sejak awal, di
          // mobile maupun desktop, supaya panel hasil tidak pernah terlihat
          // kosong/terpisah sebelum user tap search.
          renderDefaultView();
          showDragHintOnce();
        }, 280);
      } catch (e) {
        clearInterval(progressInterval);
        const pesan = e.name === 'AbortError'
          ? 'Waktu memuat data habis (koneksi lambat)'
          : 'Gagal memuat data';
        loadingText.innerHTML = pesan + "<br><button onclick=\"loadData()\">Coba lagi</button>";
      }
    }

    // Kotak pencarian dianggap "kosong" (tidak ada pencarian/filter aktif)
    // kalau teksnya kosong DAN tidak ada produk yang sudah dipilih sebagai
    // chip filter. Dalam kondisi ini, chip Produk/Toko yang menentukan
    // tampilan default.
    function isSearchEmpty() {
      const keyword = document.getElementById('search').value.trim();
      return keyword.length === 0 && selectedProducts.size === 0;
    }

    // Dipanggil saat kotak pencarian kosong: menampilkan tampilan default
    // sesuai chip yang sedang aktif (Produk atau Toko).
    function renderDefaultView() {
      if (chipMode === 'toko') {
        tampilkanSemuaToko();
      } else {
        showProductCatalog();
      }
    }

    // Tampilan default chip "Produk": seluruh daftar produk A-Z (bukan
    // cuma 8 teratas), diklik untuk ditambahkan sebagai chip filter.
    function showProductCatalog() {
      const resultsDiv = document.getElementById('results');
      currentMode = 'none';
      currentStores = [];
      markerLayer.clearLayers();
      rebuildHeatmapLayer();
      updateHeatmapDisplay();
      document.getElementById('resultCount').textContent = '';
      document.getElementById('resultHeaderRow').style.display = 'none';
      updateCitySummary([], null);

      const list = productList.filter(p => !selectedProducts.has(p));
      let html = '';
      if (!list.length) {
        html = `<div class="empty-state">Tidak ada produk lain</div>`;
      } else {
        list.forEach(prod => {
          html += `<div class="suggestion-item" onclick="selectProduct('${escapeHtml(prod)}')">🎨 ${escapeHtml(prod)}</div>`;
        });
      }
      resultsDiv.innerHTML = html;
      // Sama seperti daftar toko: begitu ada isi, sheet mobile langsung
      // terbuka penuh (bukan nyangkut minimize di bawah tanpa bisa digeser).
      setSheetState(list.length ? 'mid' : 'collapsed');
    }

    // Switch chip Produk/Toko: hanya mengganti TAMPILAN DEFAULT (saat kotak
    // pencarian kosong & tidak ada chip filter). Kotak pencarian sendiri
    // tidak pernah dinonaktifkan/ditutup oleh chip ini — keduanya independen.
    function switchChipMode(mode) {
      if (chipMode === mode) return;
      chipMode = mode;
      document.getElementById('modeChipProduk').classList.toggle('active', mode === 'produk');
      document.getElementById('modeChipToko').classList.toggle('active', mode === 'toko');
      if (isSearchEmpty()) renderDefaultView();
    }

    // Selecting a suggestion adds it as a chip (multi-select) instead of
    // replacing the typed text, so more than one product can be searched at once.
    function selectProduct(produk) {
      selectedProducts.add(produk);
      renderChips();
      cariProduk();
      const searchInput = document.getElementById('search');
      searchInput.value = '';
      searchInput.focus();
    }

    function removeProduct(produk) {
      selectedProducts.delete(produk);
      renderChips();
      cariProduk();
    }

    function renderChips() {
      const chipsDiv = document.getElementById('chips');
      let html = '';
      selectedProducts.forEach(p => {
        html += `<span class="chip">${escapeHtml(p)}<span class="remove" onclick="event.stopPropagation(); removeProduct('${escapeHtml(p)}')" aria-label="Hapus ${escapeHtml(p)}">✕</span></span>`;
      });
      chipsDiv.innerHTML = html;
      document.getElementById('clearChipsBtn').style.display = selectedProducts.size ? 'flex' : 'none';
    }

    function clearAllChips() {
      selectedProducts.clear();
      renderChips();
      cariProduk();
    }

    function cariProduk() {
      const keyword = document.getElementById('search').value.toLowerCase().trim();
      const chips = Array.from(selectedProducts).map(p => p.toLowerCase());

      if (!chips.length && !keyword) {
        // Tidak ada filter/teks aktif -> tampilkan default sesuai chip
        // Produk/Toko yang sedang aktif (link "lihat semua toko" lama sudah
        // digantikan oleh chip Toko).
        renderDefaultView();
        return;
      }

      currentMode = 'search';

      // Saran nama produk yang cocok dengan ketikan — ini berlaku untuk
      // SEMUA kondisi, tidak bergantung chip Produk/Toko mana yang sedang
      // aktif, supaya user yang mengetik "COLORTONE" tetap melihat saran
      // produk itu walau sedang di mode Toko.
      const produkSuggestions = keyword
        ? productList.filter(p => !selectedProducts.has(p) && p.toLowerCase().includes(keyword)).slice(0, 8)
        : [];

      // Group matches by store instead of by row, so a store that carries
      // more than one matching product shows up once with all its products listed.
      const groups = new Map();

      allData.forEach(row => {
        const namaToko = (row.pelanggan || '').toLowerCase();
        const namaProduk = (row.produk || '').toLowerCase();

        // Exact match for chips: a chip is a specific product from the list, so
        // "SPECTRUM" must not also match "SPECTRUM AEROSOL" or "WP SPECTRUM".
        const matchChips = chips.length > 0 && chips.some(c => namaProduk === c);
        const matchKeyword = keyword.length > 0 && (namaToko.includes(keyword) || namaProduk.includes(keyword));

        if (matchChips || matchKeyword) {
          // Prefer a store code if the data has one; otherwise fall back to
          // name + address, which together uniquely identify the same store.
          const key = row.kode ? ('kode:' + String(row.kode).toLowerCase())
            : (namaToko + '|' + (row.alamat || '').toLowerCase());

          if (!groups.has(key)) {
            groups.set(key, {
              pelanggan: row.pelanggan,
              alamat: row.alamat,
              latitude: row.latitude,
              longitude: row.longitude,
              produkSet: new Set()
            });
          }
          if (row.produk) groups.get(key).produkSet.add(row.produk);
        }
      });

      // Label konteks untuk kartu ringkasan per kota, mengikuti filter yang
      // sedang aktif (chip produk dan/atau kata kunci ketikan).
      let summaryLabel;
      if (chips.length && keyword) {
        summaryLabel = `Produk: ${Array.from(selectedProducts).join(', ')} · Pencarian: "${document.getElementById('search').value.trim()}"`;
      } else if (chips.length) {
        summaryLabel = `Produk: ${Array.from(selectedProducts).join(', ')}`;
      } else {
        summaryLabel = `Pencarian: "${document.getElementById('search').value.trim()}"`;
      }

      renderStoreList(groups, {
        allMode: false,
        emptyHtml: 'Tidak ditemukan hasil',
        produkSuggestions,
        summaryLabel
      });
    }

    // Menampilkan seluruh toko di data tanpa perlu mengetik apa pun — supaya
    // user bisa lihat dulu sebaran tokonya sebelum mencari sesuatu yang spesifik.
    function tampilkanSemuaToko() {
      currentMode = 'all';

      const groups = new Map();
      allData.forEach(row => {
        const namaToko = (row.pelanggan || '').toLowerCase();
        const key = row.kode ? ('kode:' + String(row.kode).toLowerCase())
          : (namaToko + '|' + (row.alamat || '').toLowerCase());
        if (!groups.has(key)) {
          groups.set(key, {
            pelanggan: row.pelanggan,
            alamat: row.alamat,
            latitude: row.latitude,
            longitude: row.longitude,
            produkSet: new Set()
          });
        }
        if (row.produk) groups.get(key).produkSet.add(row.produk);
      });

      renderStoreList(groups, {
        allMode: true,
        emptyHtml: 'Belum ada data toko',
        summaryLabel: 'Semua Toko'
      });
    }

    // Fungsi bersama: mengurutkan alfabetis (A-Z), merender daftar + marker cluster.
    // Membuat isi popup satu toko. Dipisah jadi fungsi sendiri supaya bisa
    // dipakai ulang oleh renderVisibleMarkers() setiap kali sebuah titik
    // baru masuk ke area peta yang terlihat.
    function buildPopupHtml(store) {
      return `<b>${store.namaAman}</b><br>${store.alamatAman}<br>${store.produkAman}<br><button class="popup-nav-btn" onclick="window.open('https://www.google.com/maps?q=${store.lat},${store.lng}','_blank')">➡ Navigasi Google Maps</button>`;
    }

    // Viewport culling: dipanggil tiap kali peta selesai digeser/di-zoom
    // (lihat listener 'moveend zoomend' di initMap()) dan juga langsung
    // setelah renderStoreList() mengisi currentStores. Hanya toko yang
    // titiknya berada dalam area peta saat ini (+ buffer 30% supaya tidak
    // "kedip" muncul belakangan saat digeser) yang benar-benar dibuatkan
    // marker dan ditambahkan ke peta — daftar di panel tetap menampilkan
    // SEMUA toko hasil filter, cuma titik di peta yang dibatasi.
    //
    // Marker yang sudah pernah dibuat (store.marker) dipakai ulang, tidak
    // dibuat ulang tiap render, supaya tetap murah dipanggil berkali-kali
    // saat user menggeser peta.
    function renderVisibleMarkers() {
      markerLayer.clearLayers();
      if (!currentStores.length) return;

      const viewBounds = map.getBounds().pad(0.3);
      currentStores.forEach(store => {
        if (!viewBounds.contains([store.lat, store.lng])) return;
        if (!store.marker) {
          store.marker = L.circleMarker([store.lat, store.lng], {
            radius: 7,
            weight: 2,
            color: '#ffffff',
            fillColor: '#1a73e8',
            fillOpacity: 1
          }).bindPopup(buildPopupHtml(store));
        }
        markerLayer.addLayer(store.marker);
      });
    }

    // Membangun ulang titik-titik heatmap dari currentStores — yaitu toko
    // yang SEDANG aktif ditampilkan sesuai filter/pencarian saat ini (sama
    // seperti sumber data renderVisibleMarkers()). Dipanggil setiap kali
    // currentStores berubah (lihat renderStoreList()), jadi heatmap selalu
    // otomatis menyesuaikan begitu hasil pencarian/chip berubah.
    function rebuildHeatmapLayer() {
      if (!heatLayer) return;
      const points = currentStores.map(s => [s.lat, s.lng, 0.6]);
      heatLayer.setLatLngs(points);
    }

    // Menentukan tampilan mana yang aktif di peta: heatmap ATAU dot
    // individual — tidak pernah dua-duanya sekaligus. Transisi ini murni
    // berdasarkan level zoom peta (map.getZoom() vs HEATMAP_ZOOM_THRESHOLD),
    // jadi tetap sejalan dengan aturan "titik toko tidak pernah dijadikan
    // cluster/angka": di zoom dekat, dot yang tampil tetap satu-satu persis
    // seperti sebelum fitur ini ada.
    function updateHeatmapDisplay() {
      const legend = document.getElementById('heatmapLegend');

      if (!features.heatmap) {
        if (map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
        if (!map.hasLayer(markerLayer)) map.addLayer(markerLayer);
        legend.style.display = 'none';
        return;
      }

      // Legenda tampil selama fitur aktif, terlepas dari zoom saat ini.
      legend.style.display = 'block';

      const zoomDekat = map.getZoom() >= HEATMAP_ZOOM_THRESHOLD;
      if (zoomDekat) {
        if (map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
        if (!map.hasLayer(markerLayer)) {
          map.addLayer(markerLayer);
          renderVisibleMarkers();
        }
      } else {
        if (map.hasLayer(markerLayer)) map.removeLayer(markerLayer);
        if (!map.hasLayer(heatLayer)) map.addLayer(heatLayer);
      }
    }

    function renderStoreList(groups, opts) {
      const resultsDiv = document.getElementById('results');
      const bounds = L.latLngBounds([]);

      let storesArr = Array.from(groups.values()).map(store => {
        const lat = parseFloat(store.latitude);
        const lng = parseFloat(store.longitude);
        const valid = isFinite(lat) && isFinite(lng);
        return { ...store, lat, lng, valid };
      });

      storesArr.sort((a, b) =>
        (a.pelanggan || '').localeCompare(b.pelanggan || '', 'id', { sensitivity: 'base' })
      );

      let html = '';
      let skipped = 0;
      currentStores = [];

      storesArr.forEach(store => {
        // Lewati toko dengan koordinat kosong/rusak alih-alih membuat marker
        // di posisi NaN yang bisa membuat Leaflet error atau marker hilang.
        if (!store.valid) { skipped++; return; }

        const produkText = Array.from(store.produkSet).join(', ');
        const idx = currentStores.length;
        const namaAman = escapeHtml(store.pelanggan);
        const alamatAman = escapeHtml(store.alamat);
        const produkAman = escapeHtml(produkText);

        html += `
            <div class="toko-item" onclick="focusMarker(${idx})">
              <div class="row">
                <span style="font-size:18px;">🏪</span>
                <span class="title">${namaAman}</span>
              </div>
              <div class="addr">${alamatAman}</div>
              <div class="prod">🎨 ${produkAman}</div>
            </div>`;

        // marker: null dulu — baru dibuat oleh renderVisibleMarkers() saat
        // titik ini kebetulan masuk area peta yang terlihat (lazy).
        currentStores.push({
          lat: store.lat, lng: store.lng,
          namaAman, alamatAman, produkAman,
          marker: null
        });
        bounds.extend([store.lat, store.lng]);
      });

      const total = currentStores.length;
      let label = '';
      if (total > 0) {
        label = opts.allMode
          ? `Menampilkan semua ${total} toko`
          : `${total} toko ditemukan`;
        if (skipped) label += ` (${skipped} tanpa koordinat valid dilewati)`;
      }

      // Saran nama produk yang cocok (kalau ada) ditampilkan di ATAS daftar
      // toko — muncul terlepas dari chip Produk/Toko mana yang sedang aktif,
      // karena kolom pencarian berlaku untuk semua, bukan cuma toko.
      let suggestionHtml = '';
      const produkSuggestions = opts.produkSuggestions || [];
      if (produkSuggestions.length) {
        suggestionHtml += `<div class="suggestion-group-label">Produk</div>`;
        produkSuggestions.forEach(prod => {
          suggestionHtml += `<div class="suggestion-item" onclick="selectProduct('${escapeHtml(prod)}')">🎨 ${escapeHtml(prod)}</div>`;
        });
        if (total > 0) suggestionHtml += `<div class="suggestion-group-label">Toko</div>`;
      }

      const bodyHtml = total > 0
        ? html
        : (produkSuggestions.length ? '' : `<div class="empty-state">${opts.emptyHtml}</div>`);

      document.getElementById('resultCount').textContent = label;
      document.getElementById('resultHeaderRow').style.display = total ? 'flex' : 'none';
      resultsDiv.innerHTML = suggestionHtml + bodyHtml;
      setSheetState((total > 0 || produkSuggestions.length) ? 'mid' : 'collapsed');

      if (total > 0) map.fitBounds(bounds.pad(0.15));
      // Render langsung untuk viewport saat ini (baik total>0 atau 0, supaya
      // marker lama ikut dibersihkan). fitBounds di atas juga akan memicu
      // event 'moveend'/'zoomend' yang sudah didengarkan di initMap() untuk
      // merender ulang begitu animasi peta selesai berpindah.
      renderVisibleMarkers();

      // Heatmap (kalau fiturnya aktif) ikut disinkronkan ke currentStores
      // yang baru, persis seperti renderVisibleMarkers() di atas.
      rebuildHeatmapLayer();
      updateHeatmapDisplay();

      updateCitySummary(storesArr.filter(s => s.valid), opts.summaryLabel);
    }

    function focusMarker(idx) {
      setSheetState('collapsed');
      const store = currentStores[idx];
      if (!store) return;
      map.flyTo([store.lat, store.lng], Math.max(map.getZoom(), 15));
      map.once('moveend', () => {
        // Setelah flyTo selesai, area tujuan otomatis masuk viewport —
        // render ulang supaya marker toko ini pasti sudah ada sebelum
        // popup-nya dibuka.
        renderVisibleMarkers();
        if (store.marker) store.marker.openPopup();
      });
    }

    // ---- Mobile bottom sheet (draggable results panel) ----
    const resultsCard = document.getElementById('resultsCard');
    const sheetHeader = document.getElementById('sheetHeader');
    const MOBILE_QUERY = '(max-width: 768px)';
    let sheetState = 'collapsed'; // 'collapsed' | 'mid' | 'full' — 3 titik snap.
                                   // 'mid' (75% tinggi panel) adalah tampilan
                                   // default begitu ada hasil/daftar untuk
                                   // ditampilkan (baik daftar default maupun
                                   // hasil pencarian) — 'full' cuma dicapai
                                   // lewat tarik/tap eksplisit oleh user.
    let sheetTranslate = 0;
    let dragStartY = 0;
    let dragStartTranslate = 0;
    let dragging = false;
    let dragMoved = false;

    function isMobile() {
      return window.matchMedia(MOBILE_QUERY).matches;
    }

    function getSnapOffsets() {
      const h = resultsCard.offsetHeight || Math.round(window.innerHeight * 0.85);
      const collapsedVisible = 64;
      // 'mid': menggeser panel turun 25% dari tingginya sendiri, sehingga
      // 75% panel tetap terlihat (peta masih kelihatan di sisa 25% layar).
      return {
        collapsed: Math.max(0, h - collapsedVisible),
        mid: Math.round(h * 0.25),
        full: 0
      };
    }

    function applySheetTranslate(px, animate) {
      resultsCard.style.transition = animate ? 'transform 0.25s ease' : 'none';
      resultsCard.style.transform = `translateY(${px}px)`;
      sheetTranslate = px;
    }

    function setSheetState(state, animate) {
      if (!isMobile()) return;
      sheetState = state;
      applySheetTranslate(getSnapOffsets()[state], animate !== false);
    }

    function startDrag(e) {
      if (!isMobile()) return;
      dragging = true;
      dragMoved = false;
      dragStartY = e.clientY;
      dragStartTranslate = sheetTranslate;
      resultsCard.style.transition = 'none';
      sheetHeader.setPointerCapture(e.pointerId);
      dismissDragHint();
    }

    // Menampilkan hint (bounce + teks singkat) sekali saja seumur hidup
    // browser user, supaya orang yang belum pernah pakai Google Maps tahu
    // bahwa panel bawah ini bisa ditarik naik/turun.
    function showDragHintOnce() {
      if (!isMobile()) return;
      if (localStorage.getItem('sheetHintShown')) return;
      sheetHeader.classList.add('hint-bounce');
      document.getElementById('sheetHintText').style.display = 'block';
      setTimeout(dismissDragHint, 2600);
    }

    function dismissDragHint() {
      sheetHeader.classList.remove('hint-bounce');
      const hintText = document.getElementById('sheetHintText');
      if (hintText) hintText.style.display = 'none';
      localStorage.setItem('sheetHintShown', '1');
    }

    function duringDrag(e) {
      if (!dragging) return;
      const dy = e.clientY - dragStartY;
      if (Math.abs(dy) > 5) dragMoved = true;
      const offsets = getSnapOffsets();
      const next = Math.max(offsets.full, Math.min(offsets.collapsed, dragStartTranslate + dy));
      applySheetTranslate(next, false);
    }

    function endDrag() {
      if (!dragging) return;
      dragging = false;

      if (!dragMoved) {
        // Tap pada handle: siklus collapsed -> mid -> full -> collapsed.
        const urutan = { collapsed: 'mid', mid: 'full', full: 'collapsed' };
        setSheetState(urutan[sheetState] || 'mid');
        return;
      }

      // Snap ke titik terdekat dari 3 pilihan (collapsed/mid/full)
      // berdasarkan posisi terakhir saat jari dilepas.
      const offsets = getSnapOffsets();
      let nearest = 'collapsed';
      let jarakTerdekat = Infinity;
      for (const state in offsets) {
        const jarak = Math.abs(sheetTranslate - offsets[state]);
        if (jarak < jarakTerdekat) { jarakTerdekat = jarak; nearest = state; }
      }
      setSheetState(nearest);
    }

    sheetHeader.addEventListener('pointerdown', startDrag);
    sheetHeader.addEventListener('pointermove', duringDrag);
    sheetHeader.addEventListener('pointerup', endDrag);
    sheetHeader.addEventListener('pointercancel', endDrag);

    function handleViewportChange() {
      if (isMobile()) {
        setSheetState(sheetState, false);
      } else {
        resultsCard.style.transform = '';
        resultsCard.style.transition = '';
      }
    }
    window.addEventListener('resize', handleViewportChange);

    const searchInput = document.getElementById('search');

    // Mengetik langsung menjalankan pencarian sungguhan (gabungan produk +
    // toko yang cocok) — di-debounce supaya tidak me-render ulang semua
    // marker di setiap ketukan tombol. Begitu kotak dikosongkan lagi,
    // cariProduk() otomatis kembali ke tampilan default sesuai chip aktif.
    let searchDebounceTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(cariProduk, 250);
    });

    // Pressing Enter runs the search and closes the suggestion list.
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(searchDebounceTimer);
        cariProduk();
      }
    });

    // Explicit search button, same result as pressing Enter.
    document.getElementById('searchBtn').addEventListener('click', () => {
      clearTimeout(searchDebounceTimer);
      cariProduk();
    });

    document.getElementById('clearChipsBtn').addEventListener('click', clearAllChips);

    // ---- Antisipasi tombol/gesture back tidak sengaja ----
    // Trik umum di app Android: setiap kali kita "menempati" sebuah state
    // history, back tidak langsung keluar dari halaman. Ada 3 lapis, dari
    // state paling "dalam" ke halaman utama:
    // 1) Kalau bottom sheet masih terbuka (full), back pertama menutup
    //    itu dulu (kembali ke collapsed).
    // 2) Kalau masih ada pencarian/filter aktif (teks di kolom cari atau
    //    chip produk terpilih), back berikutnya membersihkan itu dan
    //    membawa user ke HALAMAN UTAMA (tampilan default) — bukan langsung
    //    menutup aplikasi.
    // 3) Baru di halaman utama (tanpa pencarian aktif, panel tertutup),
    //    back berikutnya menampilkan peringatan "tekan sekali lagi untuk
    //    keluar"; back kedua dalam 2 detik itu yang benar-benar keluar.
    let awaitingSecondBack = false;
    let exitTimer = null;

    // Kembali ke tampilan awal: kosongkan kolom cari & chip produk terpilih,
    // lalu tampilkan daftar default sesuai chip Produk/Toko yang aktif,
    // dengan panel tetap tertutup (bukan langsung terbuka penuh lagi).
    function kembaliKeHalamanUtama() {
      document.getElementById('search').value = '';
      selectedProducts.clear();
      renderChips();
      renderDefaultView();
      setSheetState('collapsed');
    }

    function pushBackGuard() {
      history.pushState({ nsiGuard: true }, '', location.href);
    }

    function showExitToast() {
      const toast = document.getElementById('exitToast');
      toast.style.display = 'flex';
      clearTimeout(exitTimer);
      exitTimer = setTimeout(() => {
        toast.style.display = 'none';
        awaitingSecondBack = false;
      }, 2000);
    }

    // Tombol "Keluar" di dalam toast (opsi C): karena saat toast tampil kita
    // sudah dalam kondisi awaitingSecondBack = true, memicu history.back()
    // di sini akan ditangkap oleh popstate di bawah dan masuk ke cabang
    // "back kedua" — yaitu benar-benar keluar, sama seperti menekan
    // tombol/gesture back fisik sekali lagi. Tidak perlu logika keluar baru.
    document.getElementById('exitToastBtn').addEventListener('click', () => {
      history.back();
    });

    window.addEventListener('popstate', () => {
      const sheetTerbuka = isMobile() && sheetState !== 'collapsed';
      const adaPencarianAktif = !isSearchEmpty();

      if (sheetTerbuka) {
        // Turun satu tingkat dulu (full -> mid -> collapsed), bukan
        // langsung loncat ke collapsed dari full.
        setSheetState(sheetState === 'full' ? 'mid' : 'collapsed');
        pushBackGuard();
        return;
      }

      if (adaPencarianAktif) {
        // Panel sudah tertutup tapi masih ada pencarian/chip aktif -> jangan
        // langsung keluar, kembalikan dulu ke halaman utama.
        kembaliKeHalamanUtama();
        pushBackGuard();
        return;
      }

      if (!awaitingSecondBack) {
        // Back pertama tanpa ada apa pun untuk ditutup: jangan langsung
        // keluar, kasih peringatan (toast) + tombol "Keluar" langsung,
        // dan pasang penjaga lagi.
        awaitingSecondBack = true;
        showExitToast();
        pushBackGuard();
      } else {
        // Ini back kedua dalam waktu singkat (toast masih tampil), atau
        // tombol "Keluar" di toast ditekan -> biarkan keluar beneran,
        // tidak pasang penjaga baru.
        clearTimeout(exitTimer);
        awaitingSecondBack = false;
      }
    });

    window.onload = () => {
      initMap();
      initFeatureToggles();
      loadData();
      handleViewportChange();
      pushBackGuard();
    };
  </script>
</body>
</html>
