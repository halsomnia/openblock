<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Toko NSI</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --blue: #1a73e8;
      --blue-dark: #1765cc;
      --gray-100: #f1f3f4;
      --gray-300: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
      --shadow-1: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-2: 0 1px 3px rgba(60,64,67,.30), 0 4px 8px 3px rgba(60,64,67,.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .app { position: relative; height: 100vh; width: 100vw; }
    #map { position: absolute; inset: 0; z-index: 0; background: #e8eaed; }

    /* Floating panel, top-left, like Google Maps search + results */
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 380px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-card {
      background: #fff;
      border-radius: 24px;
      box-shadow: var(--shadow-1);
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 6px 8px 6px 20px;
      gap: 8px;
      position: relative;
      flex-shrink: 0;
    }
    .search-card .icon { font-size: 18px; color: var(--text-secondary); flex-shrink: 0; }
    #inputWrap {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 0;
    }
    #chips { display: contents; }
    .chip {
      background: var(--gray-100);
      color: var(--text);
      border-radius: 16px;
      padding: 5px 8px 5px 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .chip .remove {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chip .remove:hover { background: var(--gray-300); }
    #search {
      flex: 1;
      min-width: 90px;
      height: 32px;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
    }
    #search::placeholder { color: var(--text-secondary); }
    #searchBtn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }
    #searchBtn:hover { background: var(--gray-100); }

    .suggestions {
      display: none;
      position: absolute;
      top: 100%;
      margin-top: 8px;
      left: 0;
      right: 0;
      background: #fff;
      border-radius: 12px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 600;
      box-shadow: var(--shadow-2);
    }
    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--gray-100);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--gray-100); }

    /* Results card list, sits below the search bar */
    .results-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #resultCount {
      padding: 10px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid var(--gray-100);
      flex-shrink: 0;
    }
    .sheet-handle { display: none; }
    #results { overflow-y: auto; }
    #results:empty, #resultCount:empty { display: none; }

    .toko-item {
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--gray-100);
      transition: background 0.15s ease;
    }
    .toko-item:last-child { border-bottom: none; }
    .toko-item:hover { background: var(--gray-100); }
    .toko-item .row { display: flex; align-items: center; gap: 8px; }
    .toko-item .title { font-size: 15px; font-weight: 500; flex: 1; line-height: 1.3; }
    .toko-item .addr { color: var(--text-secondary); font-size: 13px; margin: 6px 0; line-height: 1.4; padding-left: 26px; }
    .toko-item .prod { color: var(--blue); font-size: 13px; padding-left: 26px; }

    /* Navigation button inside the Leaflet popup (replaces the old plain link) */
    .popup-nav-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
    }
    .popup-nav-btn:hover { background: var(--blue-dark); }

    .empty-state {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* GPS floating action button, bottom-right like Google Maps */
    #gpsBtn {
      position: absolute;
      z-index: 500;
      bottom: 24px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #fff;
      box-shadow: var(--shadow-1);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gpsBtn:hover { background: var(--gray-100); }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--gray-300);
      border-top: 4px solid var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 14px; color: var(--text-secondary); text-align: center; }
    #loadingText button {
      margin-top: 10px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      cursor: pointer;
    }
    .progress-bar {
      width: 220px;
      height: 4px;
      background: var(--gray-300);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 14px;
    }
    .progress { height: 100%; background: var(--blue); width: 0%; transition: width 0.2s ease; }

    /* Small screens: Google Maps mobile style — search bar spans the top,
       results become a draggable bottom sheet that can be swiped to minimize/expand. */
    @media (max-width: 768px) {
      .panel {
        left: 8px;
        right: 8px;
        width: auto;
        top: 8px;
        max-height: none;
        display: block;
      }
      .results-card {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        height: 85vh;
        max-height: 85vh;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -2px 12px rgba(60,64,67,.2);
        z-index: 700;
        touch-action: none;
      }
      .sheet-header {
        flex-shrink: 0;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .sheet-handle {
        display: block;
        width: 36px;
        height: 4px;
        background: var(--gray-300);
        border-radius: 2px;
        margin: 10px auto 2px;
      }
      #results { touch-action: pan-y; }
      #gpsBtn { bottom: 24px; right: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>

    <div class="panel">
      <div class="search-card">
        <div id="inputWrap">
          <div id="chips"></div>
          <input type="text" id="search" placeholder="Cari toko atau produk..." autocomplete="off">
        </div>
        <button id="searchBtn" title="Cari">🔍</button>
        <div id="suggestions" class="suggestions"></div>
      </div>
      <div class="results-card" id="resultsCard">
        <div class="sheet-header" id="sheetHeader">
          <div class="sheet-handle"></div>
          <div id="resultCount"></div>
        </div>
        <div id="results"></div>
      </div>
    </div>

    <button id="gpsBtn" title="Lokasi saya">📍</button>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <p id="loadingText">Memuat daftar produk...</p>
      <div class="progress-bar"><div id="progress" class="progress"></div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, markers = [];
    let allData = [];
    let selectedProducts = new Set();
    let productList = [
      "CAT KAYU", "CG TAMITEX", "COLORTONE", "CT APOLLO",
      "CT TAMITEX", "CT VINOTEX", "KEM-TONE", "SPECTRUM",
      "SPECTRUM AEROSOL", "SPECTRUM ECO", "ULTRASHIELD",
      "WALL FILLER", "WP SPECTRUM"
    ];

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([-6.92, 107.61], 11);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    async function loadData() {
      const overlay = document.getElementById('loadingOverlay');
      const progressBar = document.getElementById('progress');
      const loadingText = document.getElementById('loadingText');

      overlay.style.display = 'flex';

      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += 22 + Math.random() * 18;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
      }, 65);

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbw6VkzkHTAhyCGlmEBK_WaSO3DVzJGF3Vl95k8MTCtDIsa_zsZ1C0FBHAte74Lj7EEb2Q/exec");
        const cache = sessionStorage.getItem('nsiData');
        if (cache) {
          allData = JSON.parse(cache);
        } else {
          allData = await res.json();
          sessionStorage.setItem('nsiData', JSON.stringify(allData));
        }

        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        loadingText.textContent = "Data siap ✅";

        setTimeout(() => {
          overlay.style.display = 'none';
          if (!isMobile()) showSuggestions(productList);
        }, 280);
      } catch (e) {
        clearInterval(progressInterval);
        loadingText.innerHTML = "Gagal memuat data<br><button onclick=\"loadData()\">Coba lagi</button>";
      }
    }

    function showSuggestions(products) {
      const suggestionsDiv = document.getElementById('suggestions');
      if (!products.length) {
        suggestionsDiv.style.display = 'none';
        return;
      }
      let html = '';
      products.forEach(prod => {
        html += `<div class="suggestion-item" onclick="selectProduct('${prod}')">${prod}</div>`;
      });
      suggestionsDiv.innerHTML = html;
      suggestionsDiv.style.display = 'block';
    }

    // Filters the product list against whatever is currently typed, excluding
    // products already picked as chips, then shows the dropdown.
    function filterSuggestions(keyword) {
      const kw = keyword.toLowerCase();
      const filtered = productList.filter(p => !selectedProducts.has(p) && p.toLowerCase().includes(kw));
      showSuggestions(filtered);
    }

    // Selecting a suggestion adds it as a chip (multi-select) instead of
    // replacing the typed text, so more than one product can be searched at once.
    function selectProduct(produk) {
      selectedProducts.add(produk);
      renderChips();
      const searchInput = document.getElementById('search');
      searchInput.value = '';
      searchInput.focus();
      filterSuggestions('');
      cariProduk();
    }

    function removeProduct(produk) {
      selectedProducts.delete(produk);
      renderChips();
      cariProduk();
    }

    function renderChips() {
      const chipsDiv = document.getElementById('chips');
      let html = '';
      selectedProducts.forEach(p => {
        html += `<span class="chip">${p}<span class="remove" onclick="event.stopPropagation(); removeProduct('${p}')">✕</span></span>`;
      });
      chipsDiv.innerHTML = html;
    }

    function cariProduk() {
      const keyword = document.getElementById('search').value.toLowerCase().trim();
      const chips = Array.from(selectedProducts).map(p => p.toLowerCase());
      const resultsDiv = document.getElementById('results');

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      if (!chips.length && !keyword) {
        document.getElementById('resultCount').textContent = '';
        resultsDiv.innerHTML = `<div class="empty-state">Pilih atau ketik nama produk / toko untuk mencari</div>`;
        setSheetState('collapsed');
        return;
      }

      let found = false;

      // Group matches by store instead of by row, so a store that carries
      // more than one matching product shows up once with all its products listed.
      const groups = new Map();

      allData.forEach(row => {
        const namaToko = (row.pelanggan || '').toLowerCase();
        const namaProduk = (row.produk || '').toLowerCase();

        // Exact match for chips: a chip is a specific product from the list, so
        // "SPECTRUM" must not also match "SPECTRUM AEROSOL" or "WP SPECTRUM".
        const matchChips = chips.length > 0 && chips.some(c => namaProduk === c);
        const matchKeyword = keyword.length > 0 && (namaToko.includes(keyword) || namaProduk.includes(keyword));

        if (matchChips || matchKeyword) {
          found = true;

          // Prefer a store code if the data has one; otherwise fall back to
          // name + address, which together uniquely identify the same store.
          const key = row.kode ? ('kode:' + String(row.kode).toLowerCase())
            : (namaToko + '|' + (row.alamat || '').toLowerCase());

          if (!groups.has(key)) {
            groups.set(key, {
              pelanggan: row.pelanggan,
              alamat: row.alamat,
              latitude: row.latitude,
              longitude: row.longitude,
              produkSet: new Set()
            });
          }
          if (row.produk) groups.get(key).produkSet.add(row.produk);
        }
      });

      let html = '';

      const sortedStores = Array.from(groups.values()).sort((a, b) =>
        (a.pelanggan || '').localeCompare(b.pelanggan || '', 'id', { sensitivity: 'base' })
      );

      sortedStores.forEach(store => {
        const produkText = Array.from(store.produkSet).join(', ');
        const idx = markers.length;

        html += `
            <div class="toko-item" onclick="focusMarker(${idx},${store.latitude},${store.longitude})">
              <div class="row">
                <span style="font-size:18px;">🏪</span>
                <span class="title">${store.pelanggan}</span>
              </div>
              <div class="addr">${store.alamat}</div>
              <div class="prod">🎨 ${produkText}</div>
            </div>`;

        const marker = L.marker([parseFloat(store.latitude), parseFloat(store.longitude)])
          .addTo(map)
          .bindPopup(`<b>${store.pelanggan}</b><br>${store.alamat}<br>${produkText}<br><button class="popup-nav-btn" onclick="window.open('https://www.google.com/maps?q=${store.latitude},${store.longitude}','_blank')">➡ Navigasi Google Maps</button>`);
        markers.push(marker);
      });

      document.getElementById('resultCount').textContent = found ? (markers.length + ' toko ditemukan') : 'Tidak ditemukan hasil';
      resultsDiv.innerHTML = found ? html : `<div class="empty-state">Tidak ditemukan hasil</div>`;
      setSheetState(found ? 'full' : 'collapsed');

      if (markers.length > 0) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.15));
    }

    function focusMarker(i, lat, lng) {
      map.flyTo([lat, lng], 15);
      setSheetState('collapsed');
      setTimeout(() => {
        if (markers[i]) markers[i].openPopup();
      }, 500);
    }

    // ---- Mobile bottom sheet (draggable results panel) ----
    const resultsCard = document.getElementById('resultsCard');
    const sheetHeader = document.getElementById('sheetHeader');
    const MOBILE_QUERY = '(max-width: 768px)';
    let sheetState = 'collapsed'; // 'collapsed' | 'half' | 'full'
    let sheetTranslate = 0;
    let dragStartY = 0;
    let dragStartTranslate = 0;
    let dragging = false;
    let dragMoved = false;

    function isMobile() {
      return window.matchMedia(MOBILE_QUERY).matches;
    }

    function getSnapOffsets() {
      const h = resultsCard.offsetHeight || Math.round(window.innerHeight * 0.85);
      const collapsedVisible = 64;
      const halfVisible = window.innerHeight * 0.5;
      return {
        collapsed: Math.max(0, h - collapsedVisible),
        half: Math.max(0, h - halfVisible),
        full: 0
      };
    }

    function applySheetTranslate(px, animate) {
      resultsCard.style.transition = animate ? 'transform 0.25s ease' : 'none';
      resultsCard.style.transform = `translateY(${px}px)`;
      sheetTranslate = px;
    }

    function setSheetState(state, animate) {
      if (!isMobile()) return;
      sheetState = state;
      applySheetTranslate(getSnapOffsets()[state], animate !== false);
    }

    function startDrag(e) {
      if (!isMobile()) return;
      dragging = true;
      dragMoved = false;
      dragStartY = e.clientY;
      dragStartTranslate = sheetTranslate;
      resultsCard.style.transition = 'none';
      sheetHeader.setPointerCapture(e.pointerId);
    }

    function duringDrag(e) {
      if (!dragging) return;
      const dy = e.clientY - dragStartY;
      if (Math.abs(dy) > 5) dragMoved = true;
      const offsets = getSnapOffsets();
      const next = Math.max(offsets.full, Math.min(offsets.collapsed, dragStartTranslate + dy));
      applySheetTranslate(next, false);
    }

    function endDrag() {
      if (!dragging) return;
      dragging = false;

      if (!dragMoved) {
        // Treat as a tap on the handle: cycle collapsed -> half -> full -> collapsed.
        const next = sheetState === 'collapsed' ? 'half' : sheetState === 'half' ? 'full' : 'collapsed';
        setSheetState(next);
        return;
      }

      const offsets = getSnapOffsets();
      let nearest = 'collapsed';
      let best = Math.abs(sheetTranslate - offsets.collapsed);
      ['half', 'full'].forEach(key => {
        const dist = Math.abs(sheetTranslate - offsets[key]);
        if (dist < best) { best = dist; nearest = key; }
      });
      setSheetState(nearest);
    }

    sheetHeader.addEventListener('pointerdown', startDrag);
    sheetHeader.addEventListener('pointermove', duringDrag);
    sheetHeader.addEventListener('pointerup', endDrag);
    sheetHeader.addEventListener('pointercancel', endDrag);

    function handleViewportChange() {
      if (isMobile()) {
        setSheetState(sheetState, false);
      } else {
        resultsCard.style.transform = '';
        resultsCard.style.transition = '';
      }
    }
    window.addEventListener('resize', handleViewportChange);

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-card')) {
        document.getElementById('suggestions').style.display = 'none';
      }
    });

    const searchInput = document.getElementById('search');

    // Clicking or focusing the search field shows the product suggestion list.
    searchInput.addEventListener('focus', () => {
      filterSuggestions(searchInput.value.trim());
    });

    // Typing a store name or product name filters suggestions live and searches as you type.
    searchInput.addEventListener('input', () => {
      const val = searchInput.value.trim();
      filterSuggestions(val);
      cariProduk();
    });

    // Pressing Enter runs the search and closes the suggestion list.
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('suggestions').style.display = 'none';
        cariProduk();
      }
    });

    // Explicit search button, same result as pressing Enter.
    document.getElementById('searchBtn').addEventListener('click', () => {
      document.getElementById('suggestions').style.display = 'none';
      cariProduk();
    });

    document.getElementById('gpsBtn').onclick = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
          const ll = [p.coords.latitude, p.coords.longitude];
          map.flyTo(ll, 15);
          L.marker(ll).addTo(map).bindPopup('Lokasi Saya').openPopup();
        });
      }
    };

    window.onload = () => {
      initMap();
      loadData();
      handleViewportChange();
    };
  </script>
</body>
</html>
