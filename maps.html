<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f6f8">
  <title>NSI Maps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      /* ===== Design tokens — modern minimalist, single accent ===== */
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --accent-tint: #eef2ff;
      --accent-tint-strong: #e0e5fc;

      --ink: #18181b;
      --ink-soft: #6b6b74;
      --ink-faint: #a4a4ad;

      --surface: #ffffff;
      --canvas: #f6f6f8;
      --line: #ececef;
      --line-strong: #dcdce1;

      --shadow-xs: 0 1px 2px rgba(24,24,27,.05);
      --shadow-sm: 0 2px 10px rgba(24,24,27,.07);
      --shadow-md: 0 10px 30px rgba(24,24,27,.10);
      --shadow-lg: 0 20px 50px rgba(24,24,27,.16);

      --r-xs: 10px;
      --r-sm: 14px;
      --r-md: 18px;
      --r-lg: 24px;
      --r-pill: 999px;

      --ease: cubic-bezier(.4,0,.2,1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    .app { position: relative; height: 100vh; width: 100vw; background: var(--canvas); }
    #map { position: absolute; inset: 0; z-index: 0; background: #eef0f2; }
    #map .leaflet-control-attribution { font-family: 'DM Sans', sans-serif; font-size: 10px; }
    .leaflet-touch .leaflet-bar,
    .leaflet-touch .leaflet-control-layers {
      border: none !important;
      box-shadow: var(--shadow-sm) !important;
    }
    .leaflet-bar a {
      font-family: 'DM Sans', sans-serif !important;
      color: var(--ink) !important;
      border-color: var(--line) !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: var(--r-sm) !important;
      box-shadow: var(--shadow-md) !important;
      font-family: 'DM Sans', sans-serif;
    }
    .leaflet-popup-content { font-size: 13.5px; line-height: 1.55; color: var(--ink); margin: 12px 14px; }
    .leaflet-popup-content b { font-weight: 600; }
    .leaflet-popup-tip { box-shadow: var(--shadow-sm) !important; }

    /* ===== Context menu klik-kanan (area B-spline) ===== */
    .map-ctxmenu {
      position: absolute;
      z-index: 1000;
      background: var(--surface);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--line);
      padding: 6px;
      min-width: 200px;
      font-family: 'DM Sans', sans-serif;
      display: none;
    }
    .map-ctxmenu.visible { display: block; }
    .map-ctxmenu-item {
      padding: 9px 12px;
      font-size: 13.5px;
      color: var(--ink);
      border-radius: var(--r-xs);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .12s var(--ease);
      user-select: none;
    }
    .map-ctxmenu-item:hover { background: var(--accent-tint); color: var(--accent-dark); }
    .map-ctxmenu-item.danger:hover { background: #fef2f2; color: #dc2626; }
    .map-ctxmenu-sep { height: 1px; background: var(--line); margin: 5px 4px; }

    /* Hint bar saat mode gambar area aktif */
    .bspline-hint {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: var(--ink);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: var(--r-pill);
      box-shadow: var(--shadow-md);
      display: none;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .bspline-hint.visible { display: flex; }
    .bspline-hint .bspline-hint-cancel {
      background: rgba(255,255,255,.14);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: var(--r-pill);
      cursor: pointer;
    }
    .bspline-hint .bspline-hint-cancel:hover { background: rgba(255,255,255,.22); }

    /* Tombol di dalam popup area B-spline */
    .bspline-popup-btn {
      margin-top: 8px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r-xs);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s var(--ease);
    }
    .bspline-popup-btn:hover { background: var(--accent-dark); }

    /* Floating panel, top-left, like Google Maps search + results */
    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 380px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-card {
      background: var(--surface);
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      min-height: 54px;
      padding: 6px 8px 6px 20px;
      gap: 10px;
      position: relative;
      flex-shrink: 0;
      transition: box-shadow .2s var(--ease), border-color .2s var(--ease);
    }
    .search-card:focus-within {
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }
    .search-card .icon { font-size: 17px; color: var(--ink-soft); flex-shrink: 0; }
    #inputWrap {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 0;
    }
    /* Line-icon SVG modern (pengganti karakter teks ⌃/⌄, ‹/›, ✕) — garis
       tipis, rounded, tanpa dependensi eksternal. Rotasi antar-state
       (mis. kolaps <-> ekspand) dianimasikan lewat transform + transition
       di sini, bukan dengan mengganti isi ikon, supaya perpindahannya
       halus alih-alih "meloncat" ganti karakter. */
    .icon-svg {
      width: 16px;
      height: 16px;
      display: block;
      flex-shrink: 0;
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .icon-svg.icon-close { width: 14px; height: 14px; }
    .icon-svg.icon-rotate-180 { transform: rotate(180deg); }
    .chip .remove .icon-svg,
    .sheet-close-btn .icon-svg { transition: transform .18s var(--ease); }
    .chip .remove:hover .icon-svg,
    .sheet-close-btn:hover .icon-svg { transform: rotate(90deg); }

    #chips { display: contents; }
    .chip {
      background: var(--accent-tint);
      color: var(--accent-dark);
      border-radius: var(--r-pill);
      padding: 5px 8px 5px 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .chip .remove {
      cursor: pointer;
      color: var(--accent-dark);
      opacity: .65;
      font-size: 12px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s var(--ease), opacity .15s var(--ease);
    }
    .chip .remove:hover { background: var(--accent-tint-strong); opacity: 1; }
    #search {
      flex: 1;
      min-width: 90px;
      height: 32px;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: transparent;
    }
    #search::placeholder { color: var(--ink-faint); }
    #searchBtn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background .18s var(--ease), transform .12s var(--ease);
    }
    #searchBtn:hover { background: var(--accent-dark); }
    #searchBtn:active { transform: scale(0.94); }
    #clearChipsBtn {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      transition: background .18s var(--ease), color .18s var(--ease);
    }
    #clearChipsBtn:hover { background: var(--canvas); color: var(--ink); }

    /* Baris kontrol di bawah search bar: filter chip Produk/Toko.
       Default: disembunyikan. Muncul saat user fokus ke kotak cari.
       Tidak ada yang aktif sampai user memilih sendiri. */
    .controls-row {
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .controls-row.visible {
      display: flex;
    }

    /* Filter chips modern (ala Google Maps) — terpisah, outline saat idle,
       filled biru saat aktif. User harus memilih sendiri. */
    .mode-chip-row {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
    }
    .mode-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
      transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), transform .12s var(--ease);
    }
    .mode-chip:hover {
      background: var(--canvas);
      border-color: var(--line-strong);
    }
    .mode-chip:active {
      transform: scale(0.97);
    }
    .mode-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79,70,229,.28);
    }
    .mode-chip.active:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #fff;
    }

    /* Toolbar di dalam header sheet: berisi tombol "Fitur" untuk
       rekap/analisis hasil pencarian (Ringkasan per Kota). Ditaruh
       di dalam sheet karena fungsi-fungsi ini memang
       untuk menganalisis hasil yang sedang tampil di sheet, bukan
       kontrol independen dari peta. Selalu terlihat (tidak ikut
       disembunyikan seperti .result-header-row) supaya tombol Fitur
       tetap bisa ditekan kapan saja sheet sedang terbuka. */
    .sheet-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 16px 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      touch-action: none;
    }

    /* Tombol "Analisis" — daftar pilihan fitur tambahan (on/off) untuk
       rekap/analisis hasil pencarian, di dalam sheet. */
    .feature-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--canvas);
      border: 1px solid transparent;
      border-radius: var(--r-pill);
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
    }

    /* Tombol X di toolbar sheet: reset hasil & kembali ke halaman utama */
    .sheet-close-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      transition: background .18s var(--ease), color .18s var(--ease);
      margin-left: auto; /* selalu di kanan; di-reset ke 0 saat desktop (lihat media query) */
    }
    .sheet-close-btn:hover {
      background: var(--canvas);
      color: var(--ink);
    }

    /* Tombol kolaps daftar (Opsi 1, desktop) — menyusutkan .results-card
       jadi hanya setinggi toolbar (search bar tetap terlihat), supaya
       area peta di baliknya lebih luas tanpa kehilangan akses cari.
       Disembunyikan di mobile karena mobile sudah punya cara sendiri
       (drag sheet handle) untuk memperkecil/memperbesar sheet. */
    .collapse-list-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      transition: background .18s var(--ease), color .18s var(--ease);
    }
    .collapse-list-btn:hover {
      background: var(--canvas);
      color: var(--ink);
    }
    /* Di desktop: tombol kolaps jadi elemen pertama grup kanan (ambil alih
       margin-left:auto dari sheet-close-btn) supaya kolaps+tutup tetap
       bersebelahan rapat, bukan malah terpisah oleh dua auto-margin. */
    @media (min-width: 769px) {
      .collapse-list-btn { display: none; margin-left: auto; }
      /* Hanya tampil saat sudah ada hasil pencarian / daftar toko —
         di halaman utama (belum ada pencarian) tombol ini tidak relevan.
         Class .has-search-context di-toggle oleh setSheetState() di JS. */
      .app.has-search-context .collapse-list-btn { display: flex; }
      .sheet-close-btn { margin-left: 0; }
    }
    /* Saat daftar dikecilkan: sembunyikan semua isi sheet kecuali toolbar-nya
       sendiri (search bar tetap tampil di atas, di luar results-card).
       !important perlu karena beberapa elemen ini juga di-toggle lewat
       inline style oleh JS (mis. resultsDiv.style.display) — aturan
       !important di sini akan tetap menang tanpa mengubah logic JS yang ada. */
    .results-card.list-collapsed .city-summary-card,
    .results-card.list-collapsed .result-header-row,
    .results-card.list-collapsed #results {
      display: none !important;
    }

    .feature-btn:hover { background: var(--line); }
    /* Warna berubah saat fitur aktif (has-active) ATAU panel sedang dibuka (panel-open) */
    .feature-btn.has-active,
    .feature-btn.panel-open {
      border-color: transparent;
      color: var(--accent-dark);
      background: var(--accent-tint);
    }
    /* Tombol Fitur dimatikan (abu-abu, tidak bisa ditekan) saat daftar toko kosong / belum ada hasil */
    .feature-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
      color: var(--ink-soft);
      background: var(--canvas);
      border-color: transparent;
    }
    .feature-btn:disabled .badge {
      display: none !important;
    }
    .feature-btn .badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 1px 6px;
      line-height: 1.4;
    }

    /* Popover mengambang — hanya muncul saat tombol Analisis diklik.
       position:fixed + z-index tinggi supaya tidak mendorong layout sheet
       dan tidak ter-clip overflow:hidden pada .results-card. */
    .feature-panel {
      position: fixed;
      z-index: 900;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-md);
      margin: 0;
      padding: 6px;
      width: 280px;
      max-width: calc(100vw - 24px);
      animation: featurePanelIn 0.18s var(--ease);
    }
    @keyframes featurePanelIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .feature-panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 8px 10px 4px;
    }
    .feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 10px;
      border-radius: var(--r-xs);
    }
    .feature-row:hover { background: var(--canvas); }
    .feature-text { min-width: 0; }
    .feature-title { font-size: 13px; font-weight: 500; }
    .feature-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }

    /* iOS-style on/off switch */
    .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--line-strong);
      transition: background-color .2s var(--ease);
      border-radius: 22px;
    }
    .switch .slider:before {
      position: absolute; content: "";
      height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff;
      transition: transform .2s var(--ease);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
    }
    .switch input:checked + .slider { background-color: var(--accent); }
    .switch input:checked + .slider:before { transform: translateX(16px); }

    /* Kartu ringkasan per kota — di dalam sheet, bisa di-scroll penuh
       sampai teks paling bawah (padding-bottom besar). */
    .city-summary-card {
      background: var(--surface);
      border-radius: 0;
      box-shadow: none;
      border-top: 1px solid var(--line);
      border-bottom: none;
      margin: 0;
      padding: 16px 16px 140px;
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    /* Saat ringkasan aktif: sheet-header jadi flex-column DAN mengisi
       sisa ruang sheet, supaya kartu ringkasan bisa dibatasi tingginya
       dan overflow-y:auto pada .city-summary-card bisa scroll (berlaku
       di semua ukuran layar, bukan cuma mobile). Sengaja hanya dipasang
       lewat class .summary-mode (bukan di .sheet-header dasar) supaya
       tampilan normal/toolbar (tombol Analisis) tidak ikut berubah. */
    .sheet-header.summary-mode {
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    /* Di desktop, sheet BUKAN bottom-sheet yang di-translate keluar layar
       seperti di mobile — kalau tidak disembunyikan lewat display:none,
       kotak putih kosong tetap kelihatan meski belum ada pencarian sama
       sekali. Class ini di-toggle oleh setSheetState() saat state 'hidden'. */
    @media (min-width: 769px) {
      .results-card.sheet-hidden-desktop {
        display: none;
      }
    }
    .city-summary-header {
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .city-summary-sub {
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .city-summary-sub b { color: var(--ink); font-weight: 600; }
    .city-summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }
    .city-summary-rank {
      width: 16px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--ink-faint);
      text-align: right;
    }
    .city-summary-name {
      font-size: 13px;
      width: 108px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .city-summary-bar-wrap {
      flex: 1;
      background: var(--canvas);
      border-radius: var(--r-pill);
      height: 8px;
      overflow: hidden;
      min-width: 24px;
    }
    .city-summary-bar {
      height: 100%;
      background: var(--accent);
      border-radius: var(--r-pill);
      transition: width .3s var(--ease);
    }
    .city-summary-count {
      font-size: 12px;
      font-weight: 600;
      width: 66px;
      text-align: right;
      flex-shrink: 0;
      color: var(--ink-soft);
    }
    .city-summary-total {
      margin-top: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }
    .city-summary-empty {
      padding: 10px 0 16px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
      transition: background .15s var(--ease);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover { background: var(--canvas); }

    /* Results card list, sits below the search bar */
    .results-card {
      background: var(--surface);
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .result-header-row {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    #resultCount {
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      min-width: 0;
    }
    .sheet-handle { display: none; }
    @keyframes handleBounceHint {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .sheet-header.hint-bounce .sheet-handle {
      animation: handleBounceHint 0.6s ease-in-out 3;
    }
    #sheetHintText {
      display: none;
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      padding-bottom: 6px;
      transition: opacity 0.4s ease;
    }
    .link-btn {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }
    .suggestion-group-label {
      padding: 10px 16px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    #results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      /* Padding bawah besar supaya item terakhir bisa di-scroll
         sepenuhnya ke atas (tidak tertutup nav bar / tepi sheet) */
      padding-bottom: 120px;
    }
    #results:empty { display: none; }

    .toko-item {
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s var(--ease);
    }
    .toko-item:last-child {
      border-bottom: none;
      /* Extra ruang di item terakhir agar teks paling bawah terbaca penuh */
      padding-bottom: 28px;
    }
    .toko-item:hover { background: var(--canvas); }
    .toko-item .row { display: flex; align-items: center; gap: 10px; }
    .toko-item .title { font-size: 15px; font-weight: 600; flex: 1; line-height: 1.3; }
    .toko-item .addr { color: var(--ink-soft); font-size: 13px; margin: 6px 0; line-height: 1.45; padding-left: 28px; }
    .toko-item .prod { color: var(--accent); font-size: 13px; padding-left: 28px; font-weight: 500; }

    /* Navigation button inside the Leaflet popup (replaces the old plain link) */
    .popup-nav-btn {
      margin-top: 10px;
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: var(--r-xs);
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background .18s var(--ease);
    }
    .popup-nav-btn:hover { background: var(--accent-dark); }

    .empty-state {
      padding: 36px 20px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 14px;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.98);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .loading-brand {
      margin-bottom: 28px;
      text-align: center;
    }
    .loading-brand-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 14px; color: var(--ink-soft); text-align: center; }
    #loadingText button {
      margin-top: 12px;
      padding: 9px 18px;
      border: none;
      border-radius: var(--r-pill);
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background .18s var(--ease);
    }
    #loadingText button:hover { background: var(--accent-dark); }
    .progress-bar {
      width: 220px;
      height: 4px;
      background: var(--line);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 16px;
    }
    .progress { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }

    /* Small screens: Google Maps mobile style — search bar spans the top,
       results become a draggable bottom sheet that can be swiped to minimize/expand. */
    @media (max-width: 768px) {
      .panel {
        left: 10px;
        right: 10px;
        width: auto;
        top: 10px;
        max-height: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* Search bar & chip mode terlalu nempel di layar sempit — kasih
         lebih banyak ruang napas (padding/gap) supaya lebih enak disentuh
         jari dan tidak terasa berdesakan. */
      .search-card {
        padding: 8px 10px 8px 18px;
        gap: 10px;
        min-height: 54px;
      }
      #inputWrap { gap: 8px; }
      .chip { padding: 7px 10px 7px 14px; }
      .mode-chip { padding: 10px 14px; }
      .results-card {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        /* Hampir full layar supaya saat full bisa menutupi kotak search (ala Google Maps) */
        height: 100%;
        height: 100dvh;
        max-height: 100%;
        max-height: 100dvh;
        border-radius: var(--r-lg) var(--r-lg) 0 0;
        box-shadow: 0 -8px 30px rgba(24,24,27,.14);
        border: none;
        z-index: 700;
        /* Jangan set touch-action:none di seluruh card — biarkan #results
           bisa di-scroll (list produk/toko) tanpa harus buka full sheet.
           touch-action:none hanya di .sheet-header untuk drag sheet. */
        transition: border-radius 0.2s ease;
      }
      /* Saat full, hilangkan radius atas supaya benar-benar menutupi search bar */
      .results-card.sheet-full {
        border-radius: 0;
      }
      .sheet-header {
        flex-shrink: 0;
        cursor: grab;
        user-select: none;
        /* Area pegangan diperbesar (min-height + padding) supaya jari tidak
           perlu presisi menyentuh garis kecil — seluruh area ini bisa
           di-tap (buka/tutup) atau ditarik (geser bebas). */
        min-height: 44px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 8px 0 0;
        overflow: hidden;
      }
      /* Drag sheet hanya di handle + toolbar, jangan blokir scroll di ringkasan */
      .sheet-handle,
      .sheet-toolbar {
        touch-action: none;
      }
      .sheet-handle {
        display: block;
        width: 40px;
        height: 5px;
        background: var(--line-strong);
        border-radius: var(--r-pill);
        margin: 6px auto;
        flex-shrink: 0;
      }
      .sheet-header:active .sheet-handle { background: var(--ink-soft); }
      .result-header-row { padding: 12px 16px; }
      #results { touch-action: pan-y; }
      .sheet-header.summary-mode {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 100%;
      }
    }
    /* Exit confirmation modal — matching app design tokens */
    .exit-modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .exit-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(24, 24, 27, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .exit-modal-card {
      position: relative;
      background: var(--surface);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
      width: 100%;
      max-width: 320px;
      padding: 28px 24px 24px;
      text-align: center;
      animation: exitModalIn 0.22s var(--ease);
    }
    @keyframes exitModalIn {
      from { opacity: 0; transform: scale(0.94) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .exit-modal-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      line-height: 1.35;
    }
    .exit-modal-actions {
      display: flex;
      gap: 10px;
    }
    .exit-btn {
      flex: 1;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--r-pill);
      padding: 12px 16px;
      cursor: pointer;
      transition: background .18s var(--ease), transform .12s var(--ease), box-shadow .18s var(--ease);
    }
    .exit-btn:active { transform: scale(0.97); }
    .exit-btn-cancel {
      background: var(--canvas);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .exit-btn-cancel:hover {
      background: var(--line);
    }
    .exit-btn-confirm {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.28);
    }
    .exit-btn-confirm:hover {
      background: var(--accent-dark);
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>

    <!-- Context menu klik-kanan untuk fitur gambar area (B-spline) -->
    <div id="mapCtxMenu" class="map-ctxmenu">

      <div id="ctxCancelDraw" class="map-ctxmenu-item danger" style="display:none;">✕ Batal gambar</div>
    </div>

    <!-- Hint bar saat mode gambar area aktif -->
    <div id="bsplineHint" class="bspline-hint">

      <button type="button" class="bspline-hint-cancel" id="bsplineHintCancel">Batal</button>

    <div class="panel">
      <div class="search-card">
        <div id="inputWrap">
          <div id="chips"></div>
          <input type="text" id="search" placeholder="Cari toko atau produk..." autocomplete="off">
        </div>
        <button id="clearChipsBtn" title="Hapus semua produk terpilih" aria-label="Hapus semua produk terpilih" style="display:none;">🗑</button>
        <button id="searchBtn" title="Cari" aria-label="Cari">🔍</button>
      </div>
      <div class="controls-row">
        <div class="mode-chip-row">
          <button type="button" class="mode-chip" id="modeChipProduk" onclick="switchChipMode('produk')">🎨 Produk</button>
          <button type="button" class="mode-chip" id="modeChipToko" onclick="switchChipMode('toko')">🏪 Toko</button>
        </div>
      </div>

      <div class="results-card" id="resultsCard">
        <div class="sheet-header" id="sheetHeader">
          <div class="sheet-handle"></div>
          <div id="sheetHintText">Tarik ke atas untuk lihat daftar toko</div>
          <div class="sheet-toolbar" id="sheetToolbar">
            <button type="button" class="feature-btn" id="featureToggleBtn" onclick="toggleFeaturePanel()">
              ⚙️ Analisis <span id="featureActiveBadge" class="badge" style="display:none;">1</span>
            </button>
            <button type="button" class="collapse-list-btn" id="collapseListBtn" onclick="toggleListCollapse()" title="Kecilkan daftar" aria-label="Kecilkan daftar">
              <svg id="collapseListIcon" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 15 12 9 18 15"></polyline>
              </svg>
            </button>
            <button type="button" class="sheet-close-btn" id="sheetCloseBtn" onclick="kembaliKeHalamanUtama()" title="Tutup &amp; reset hasil" aria-label="Tutup dan reset hasil">
              <svg class="icon-svg icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
              </svg>
            </button>
          </div>
          <!-- Ringkasan per kota di dalam sheet -->
          <div class="city-summary-card" id="citySummaryCard" style="display:none;"></div>
          <div class="result-header-row" id="resultHeaderRow">
            <div id="resultCount"></div>
          </div>
        </div>
        <div id="results"></div>
      </div>
    </div>

    <!-- Popover Analisis mengambang (di luar sheet supaya tidak ter-clip) -->
    <div class="feature-panel" id="featurePanel" style="display:none;" role="dialog" aria-label="Pilihan Fitur">
      <div class="feature-panel-title">Pilihan Fitur</div>
      <div class="feature-row">
        <div class="feature-text">
          <div class="feature-title">📊 Ringkasan per Kota</div>
          <div class="feature-desc">Tampilkan jumlah toko per kota.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleCitySummary" onchange="onFeatureToggle('citySummary', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div id="exitModal" class="exit-modal" style="display: none;" aria-hidden="true">
      <div class="exit-modal-backdrop" id="exitModalBackdrop"></div>

        <div class="exit-modal-title" id="exitModalTitle">Keluar dari NSI Maps?</div>
        <div class="exit-modal-actions">
          <button type="button" class="exit-btn exit-btn-cancel" id="exitCancelBtn">Batal</button>
          <button type="button" class="exit-btn exit-btn-confirm" id="exitConfirmBtn">Keluar</button>
        </div>

    <div id="loadingOverlay" class="loading-overlay">

  <script>

    let currentStores = [];

    let lastSummaryStores = [];

    let isInitialLoad = true;

    function autoOpenSheet(hasContent, forceOpen) {
      if (isInitialLoad) {
        isInitialLoad = false;
        // Halaman utama: sheet sepenuhnya disembunyikan
        setSheetState('hidden');
        return;
      }

      // forceOpen dipakai saat user menekan chip Produk atau Toko.

      if (isSearchEmpty() && !forceOpen) {
        setSheetState('hidden');

      setSheetState(hasContent || forceOpen ? 'mid' : 'hidden');
