    function toRad(deg) { return deg * Math.PI / 180; }

    // Jarak haversine (km) antara dua titik koordinat.
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Kota terdekat dari sebuah koordinat toko, berdasarkan titik pusat
    // kota/kabupaten yang sudah didaftar di CITY_POINTS.
    function nearestCity(lat, lng) {
      let best = null, bestDist = Infinity;
      for (const c of CITY_POINTS) {
        const d = haversineKm(lat, lng, c.lat, c.lng);
        if (d < bestDist) { bestDist = d; best = c.name; }
      }
      return best || 'Tidak diketahui';
    }

    // Merender (atau menyembunyikan) kartu ringkasan per kota. Dipanggil
    // setiap kali daftar toko dirender ulang, supaya statistiknya selalu
    // mengikuti hasil/filter yang sedang tampil. Kalau fiturnya sedang
    // OFF, kartu selalu disembunyikan (kembali ke tampilan default).
    // Memendekkan "Kabupaten" -> "Kab." khusus untuk label yang ditampilkan
    // di kartu ringkasan per kota (nama lengkap tetap dipakai di atribut
    // title, jadi masih terbaca lengkap saat di-hover). Nama kota/kotamadya
    // yang tidak diawali "Kabupaten" tidak berubah.
    function singkatNamaKota(nama) {
      return nama.replace(/^Kabupaten\s+/, 'Kab. ');
    }

    function updateCitySummary(storesValid, label) {
      const card = document.getElementById('citySummaryCard');
      if (!features.citySummary) {
        card.style.display = 'none';
        return;
      }
      if (!storesValid.length) {
        card.style.display = 'block';
        card.innerHTML = `
          <div class="city-summary-header">📊 Ringkasan per Kota</div>
          <div class="city-summary-empty">Belum ada toko untuk diringkas pada tampilan ini.</div>`;
        return;
      }

      const counts = new Map();
      storesValid.forEach(store => {
        const kota = nearestCity(store.lat, store.lng);
        counts.set(kota, (counts.get(kota) || 0) + 1);
      });

      const rows = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
      const maxCount = rows[0][1];
      const total = storesValid.length;

      let rowsHtml = '';
      rows.forEach(([kota, jumlah], i) => {
        const pct = Math.max(6, Math.round((jumlah / maxCount) * 100));
        rowsHtml += `
          <div class="city-summary-row">
            <div class="city-summary-rank">${i + 1}</div>
            <div class="city-summary-name" title="${escapeHtml(kota)}">${escapeHtml(singkatNamaKota(kota))}</div>
            <div class="city-summary-bar-wrap"><div class="city-summary-bar" style="width:${pct}%"></div></div>
            <div class="city-summary-count">${jumlah} toko</div>
          </div>`;
      });

      card.style.display = 'block';
      card.innerHTML = `
        <div class="city-summary-header">📊 Ringkasan per Kota</div>
        <div class="city-summary-sub">${label ? escapeHtml(label) : ''}</div>
        ${rowsHtml}
        <div class="city-summary-total"><span>Total</span><span>${total} toko · ${rows.length} kota</span></div>`;
    }

    // Popover Analisis mengambang: hanya muncul saat tombol diklik,
    // diposisikan di dekat tombol (fixed), tidak mendorong layout sheet.
    let featurePanelOpen = false;

    // Kembalikan daftar ke ukuran normal kalau sedang dikecilkan (desktop) —
    // dipanggil dari titik-titik di mana konten baru perlu langsung terlihat
    // (hasil pencarian baru, dst). Buka popover Analisis TIDAK memaksa expand.
    function expandListIfCollapsed() {
      const card = document.getElementById('resultsCard');
      if (!card || !card.classList.contains('list-collapsed')) return;
      card.classList.remove('list-collapsed');
      const icon = document.getElementById('collapseListIcon');
      if (icon) icon.classList.remove('icon-rotate-180');
      const btn = document.getElementById('collapseListBtn');
      if (btn) { btn.title = 'Kecilkan daftar'; btn.setAttribute('aria-label', 'Kecilkan daftar'); }
    }

    // Posisikan popover di bawah (atau di atas jika ruang kurang) tombol Analisis.
    function positionFeaturePanel() {
      const btn = document.getElementById('featureToggleBtn');
      const panel = document.getElementById('featurePanel');
      if (!btn || !panel || panel.style.display === 'none') return;
      const rect = btn.getBoundingClientRect();
      const panelW = Math.min(280, window.innerWidth - 24);
      let left = rect.left;
      if (left + panelW > window.innerWidth - 12) {
        left = window.innerWidth - panelW - 12;
      }
      if (left < 12) left = 12;

      // Ukur tinggi panel setelah tampil
      const panelH = panel.offsetHeight || 160;
      let top = rect.bottom + 8;
      if (top + panelH > window.innerHeight - 12) {
        top = rect.top - panelH - 8;
        if (top < 12) top = 12;
      }
      panel.style.top = top + 'px';
      panel.style.left = left + 'px';
      panel.style.width = panelW + 'px';
    }

    function toggleFeaturePanel() {
      const btn = document.getElementById('featureToggleBtn');
      if (!btn || btn.disabled || btn.style.display === 'none') return;

      const panel = document.getElementById('featurePanel');
      if (!panel) return;
      const willOpen = panel.style.display === 'none' || !panel.style.display;
      if (willOpen) {
        panel.style.display = 'block';
        featurePanelOpen = true;
        btn.classList.add('panel-open');
        // Restart animasi tiap buka
        panel.style.animation = 'none';
        void panel.offsetWidth;
        panel.style.animation = '';
        positionFeaturePanel();
      } else {
        closeFeaturePanel();
      }
    }

    // Opsi 1 (desktop): kecilkan/perbesar daftar hasil — search bar & mode
    // chip tetap terlihat, hanya #results/city-summary yang disembunyikan
    // supaya .results-card menyusut jadi seukuran toolbar saja.
    function toggleListCollapse() {
      const card = document.getElementById('resultsCard');
      const icon = document.getElementById('collapseListIcon');
      const btn = document.getElementById('collapseListBtn');
      if (!card) return;
      const collapsed = card.classList.toggle('list-collapsed');
      if (icon) icon.classList.toggle('icon-rotate-180', collapsed);
      if (btn) {
        btn.title = collapsed ? 'Perbesar daftar' : 'Kecilkan daftar';
        btn.setAttribute('aria-label', collapsed ? 'Perbesar daftar' : 'Kecilkan daftar');
      }
      // Popover tetap bisa terbuka saat list collapsed; re-posisi saja
      if (featurePanelOpen) positionFeaturePanel();
    }

    // Tutup panel Analisis (helper)
    function closeFeaturePanel() {
      const panel = document.getElementById('featurePanel');
      const btn = document.getElementById('featureToggleBtn');
      if (panel) panel.style.display = 'none';
      featurePanelOpen = false;
      if (btn) btn.classList.remove('panel-open');
    }

    // Klik di luar popover → tutup (tombol Analisis ditangani oleh toggle-nya sendiri)
    document.addEventListener('pointerdown', function(e) {
      if (!featurePanelOpen) return;
      const panel = document.getElementById('featurePanel');
      const btn = document.getElementById('featureToggleBtn');
      if (!panel) return;
      if (panel.contains(e.target)) return;
      if (btn && btn.contains(e.target)) return;
      closeFeaturePanel();
    });

    window.addEventListener('resize', function() {
      if (featurePanelOpen) positionFeaturePanel();
    });

    // Dipanggil saat sebuah switch fitur di-toggle.
    // Hanya SATU fitur yang boleh ON (mutual exclusive).
    function onFeatureToggle(key, checked) {
      // CATATAN PERBAIKAN BUG "toggle ON otomatis menutup panel":
      // Sebelumnya, satu error tak terduga di salah satu langkah sinkronisasi
      // UI di bawah (mis. updateCitySummary) akan
      // ditangkap oleh catch paling luar, yang lalu MEMAKSA mematikan KEDUA
      // toggle dan MENUTUP panel Analisis — walau fitur yang baru saja
      // dinyalakan user sebenarnya baik-baik saja. Sekarang tiap langkah
      // diisolasi try/catch masing-masing, supaya satu langkah gagal tidak
      // menjatuhkan/mereset seluruh state, dan panel TIDAK ditutup paksa
      // hanya karena satu efek samping (mis. update kartu ringkasan) error.
      try {
        if (checked) {
          // Matikan semua fitur lain (hanya satu yang boleh aktif)
          Object.keys(features).forEach(k => {
            if (k !== key) {
              features[k] = false;
              const el = document.getElementById(
                k === 'citySummary' ? 'toggleCitySummary' : null
              );
              if (el) el.checked = false;
            }
          });
          features[key] = true;
          // Saat fitur dinyalakan → tutup panel Analisis otomatis
          // (user tidak perlu menutup manual)
          closeFeaturePanel();
        } else {
          features[key] = false;
          // Saat fitur dimatikan → tutup panel Analisis
          closeFeaturePanel();
        }
      } catch (err) {
        console.error('onFeatureToggle: gagal set state fitur', err);
        return;
      }

      try { localStorage.setItem('nsiFeatures', JSON.stringify(features)); } catch (e) {}
      try { updateFeatureBadge(); } catch (e) { console.error('updateFeatureBadge error:', e); }

      // Sinkronkan kartu ringkasan & visibility list (tanpa re-render daftar).
      // Selalu dipanggil (bukan hanya saat key === 'citySummary') karena
      // updateCitySummary() sendiri sudah memeriksa features.citySummary —
      // jika fitur lain baru saja mematikannya, kartu ini harus ikut
      // disembunyikan saat itu juga, bukan tersisa nyangkut menampilkan
      // data lama di layar.
      // Masing-masing dibungkus try/catch SENDIRI (bukan satu try besar)
      // supaya kegagalan di satu langkah tidak ikut membatalkan langkah lain
      // ataupun memicu reset paksa toggle/panel.
      try { updateCitySummary(lastSummaryStores, lastSummaryLabel); } catch (e) { console.error('updateCitySummary error:', e); }
      try { applyCitySummaryListVisibility(); } catch (e) { console.error('applyCitySummaryListVisibility error:', e); }
      try { updateFeatureButtonState(); } catch (e) { console.error('updateFeatureButtonState error:', e); }

      // Perilaku sheet sesuai fitur:
      // - Ringkasan per Kota ON → sheet full (daftar kota bisa di-scroll lega)
      // - Fitur OFF / lainnya → sheet mid 80%
      try {
        if (key === 'citySummary' && checked) {
          setSheetState('full');
        } else {
          if (sheetState !== 'hidden') {
            setSheetState('mid');
          }
        }
      } catch (err) {
        console.error('onFeatureToggle: gagal set sheet state', err);
      }
    }

    // Sembunyikan/tampilkan list toko sesuai status Ringkasan per Kota.
    function applyCitySummaryListVisibility() {
      const resultsDiv = document.getElementById('results');
      const headerRow = document.getElementById('resultHeaderRow');
      const sheetHeaderEl = document.getElementById('sheetHeader');
      if (!resultsDiv) return;

      if (features.citySummary && currentStores.length > 0) {
        resultsDiv.style.display = 'none';
        if (headerRow) headerRow.style.display = 'none';
        if (sheetHeaderEl) sheetHeaderEl.classList.add('summary-mode');
      } else {
        resultsDiv.style.display = '';
        if (headerRow) {
          headerRow.style.display = currentStores.length > 0 ? 'flex' : 'none';
        }
        if (sheetHeaderEl) sheetHeaderEl.classList.remove('summary-mode');
      }
    }

    function updateFeatureBadge() {
      const aktif = Object.values(features).filter(Boolean).length;
      const badge = document.getElementById('featureActiveBadge');
      const btn = document.getElementById('featureToggleBtn');
      if (badge) {
        badge.style.display = aktif ? 'inline' : 'none';
        badge.textContent = String(aktif);
      }
      if (btn) btn.classList.toggle('has-active', aktif > 0);
    }

    // Status tombol Analisis:
    // - Tampil jika sedang menampilkan daftar TOKO (bukan katalog produk)
    // - Aktif (enabled) jika ada toko ATAU ada fitur yang masih on
    // - Selalu restore display supaya tidak "hilang" setelah toggle fitur berkali-kali
    function updateFeatureButtonState() {
      const btn = document.getElementById('featureToggleBtn');
      if (!btn) return;

      const hasStores = currentStores.length > 0;
      // currentMode 'none' = katalog produk; selain itu = daftar toko / search
      const showingProductCatalog = (currentMode === 'none' && !hasStores);
      const anyFeatureOn = Object.values(features).some(Boolean);

      // Selalu set ulang display secara eksplisit (cegah nyangkut display:none)
      if (showingProductCatalog) {
        btn.style.display = 'none';
      } else {
        btn.style.display = '';
      }

      btn.disabled = !(hasStores || anyFeatureOn);

      // Jika tidak ada toko dan panel terbuka, tutup panel
      if (!hasStores && !anyFeatureOn && featurePanelOpen) {
        closeFeaturePanel();
      }
    }

    // Memuat preferensi fitur yang tersimpan (kalau ada) saat aplikasi dibuka.
    // Hanya satu fitur yang boleh aktif (mutual exclusive).
    function initFeatureToggles() {
      try {
        const saved = JSON.parse(localStorage.getItem('nsiFeatures') || '{}');
        if (typeof saved.citySummary === 'boolean') features.citySummary = saved.citySummary;
      } catch (e) {}
      document.getElementById('toggleCitySummary').checked = features.citySummary;
      updateFeatureBadge();
    }

    function initMap() {
      // preferCanvas: semua marker vektor (circleMarker) digambar di satu
      // <canvas>, bukan sebagai elemen DOM terpisah per toko. Ini yang
      // membuat pan/zoom tetap mulus walau titiknya ratusan-ribuan,
      // karena browser tidak perlu reflow/repaint ratusan elemen DOM
      // setiap kali peta digeser/di-zoom.
      map = L.map('map', { zoomControl: false, preferCanvas: true }).setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM);
      L.control.zoom({ position: 'bottomright' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      // PENTING: tidak pakai marker cluster. Semua titik toko harus selalu
      // tampil satu per satu di peta, berapa pun jumlahnya dan di zoom
      // berapa pun — tidak boleh "dijumlahkan"/dikelompokkan jadi satu
      // angka bulat saat zoom out. Ini perilaku default aplikasi.
      //
      // Sebagai gantinya, performa dijaga lewat 2 hal:
      // 1) Marker dibuat sebagai L.circleMarker (canvas) alih-alih
      //    L.marker (DOM/gambar) — lihat renderVisibleMarkers().
      // 2) Viewport culling: hanya marker yang berada di area peta yang
      //    sedang terlihat (+ buffer) yang benar-benar ditambahkan ke
      //    layer; sisanya baru dibuat saat area itu masuk layar. Daftar
      //    toko di panel tetap menampilkan SEMUA hasil, tidak dipotong —
      //    yang di-cull cuma titik di peta, bukan datanya.
      markerLayer = L.layerGroup();
      map.addLayer(markerLayer);

      let viewportRenderTimer = null;
      map.on('moveend zoomend', () => {
        clearTimeout(viewportRenderTimer);
        viewportRenderTimer = setTimeout(() => {
          // Kalau moveend ini berasal dari focusMarker() (klik toko di
          // list), render + buka popup-nya sudah ditangani manual di sana
          // — lewati render otomatis ini sekali supaya tidak menutup
          // popup yang baru dibuka.
          if (suppressAutoViewportRender) {
            suppressAutoViewportRender = false;
            return;
          }
          renderVisibleMarkers();
        }, 120);
      });

      initBsplineAreaTool();
    }

    // =====================================================================
    // FITUR: Gambar area bebas (B-spline) via klik kanan
    // -----------------------------------------------------------------
    // - Klik kanan di peta -> muncul context menu custom ("Mulai gambar
    //   area"). Browser context menu bawaan otomatis ditekan oleh Leaflet
    //   saat klik kanan di atas peta.
    // - Selama mode gambar aktif, tiap klik kiri di peta menambah 1 titik
    //   kontrol. Titik-titik ini dihubungkan sementara dengan garis putus
    //   lurus (guide) supaya user tahu urutan titiknya.
    // - Klik pada titik AWAL lagi (radius toleransi dalam piksel layar),
    //   atau pilih "Selesai" di context menu / hint bar, akan menutup area:
    //   titik-titik kontrol dipakai untuk membangun kurva B-spline kubik
    //   seragam yang closed-loop (tepi area jadi melengkung halus, bukan
    //   garis lurus antar titik seperti polygon biasa).
    // - Area yang sudah jadi dikasih popup dengan 1 tombol: buka centroid
    //   area itu di Google Maps (tab baru). Tidak ada penyimpanan
    //   (localStorage) untuk area ini secara sengaja -- hanya sementara
    //   per sesi, dan membuat area baru otomatis membersihkan area lama.
    // =====================================================================
    let bsplineMode = false;              // true = sedang dalam mode klik-tambah-titik
    let bsplinePoints = [];               // array {lat,lng} titik kontrol yang sudah diklik
    let bsplineDraftLayer = null;         // layer group: marker titik + garis guide putus-putus
    let bsplineAreaLayer = null;          // layer polygon hasil akhir (area B-spline jadi)
    const BSPLINE_CLOSE_TOLERANCE_PX = 16; // toleransi klik dekat titik awal (piksel layar) untuk auto-tutup
    const BSPLINE_MIN_POINTS = 3;          // minimal titik supaya bisa jadi area

    function initBsplineAreaTool() {
      const ctxMenu = document.getElementById('mapCtxMenu');
      const ctxStart = document.getElementById('ctxStartDraw');
      const ctxFinish = document.getElementById('ctxFinishDraw');
      const ctxCancel = document.getElementById('ctxCancelDraw');
      const hintBar = document.getElementById('bsplineHint');
      const hintCancelBtn = document.getElementById('bsplineHintCancel');

      function hideCtxMenu() { ctxMenu.classList.remove('visible'); }

      function showCtxMenu(containerPoint) {
        // containerPoint: posisi klik relatif ke elemen #map (bukan
        // koordinat layar penuh), supaya menu muncul persis di titik klik.
        ctxMenu.style.left = containerPoint.x + 'px';
        ctxMenu.style.top = containerPoint.y + 'px';
        ctxStart.style.display = bsplineMode ? 'none' : 'flex';
        ctxFinish.style.display = (bsplineMode && bsplinePoints.length >= BSPLINE_MIN_POINTS) ? 'flex' : 'none';
        ctxCancel.style.display = bsplineMode ? 'flex' : 'none';
        ctxMenu.classList.add('visible');
      }

      map.on('contextmenu', (e) => {
        showCtxMenu(e.containerPoint);
      });
      map.on('movestart zoomstart', hideCtxMenu);
      document.addEventListener('click', (e) => {
        if (!ctxMenu.contains(e.target)) hideCtxMenu();
      });

      ctxStart.addEventListener('click', () => { hideCtxMenu(); startBsplineDrawing(); });
      ctxFinish.addEventListener('click', () => { hideCtxMenu(); finishBsplineArea(); });
      ctxCancel.addEventListener('click', () => { hideCtxMenu(); cancelBsplineDrawing(); });
      hintCancelBtn.addEventListener('click', cancelBsplineDrawing);

      map.on('click', (e) => {
        if (!bsplineMode) return;
        handleBsplineMapClick(e);
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && bsplineMode) cancelBsplineDrawing();
      });
    }

    function startBsplineDrawing() {
      // Mulai sesi gambar baru selalu membersihkan area lama, karena
      // fitur ini sengaja dibuat "1 area aktif" tanpa penyimpanan.
      if (bsplineAreaLayer) { map.removeLayer(bsplineAreaLayer); bsplineAreaLayer = null; }
      cancelBsplineDrawing(); // reset draft kalau ada sisa sesi sebelumnya

      bsplineMode = true;
      bsplinePoints = [];
      bsplineDraftLayer = L.layerGroup().addTo(map);
      document.getElementById('bsplineHint').classList.add('visible');
      updateBsplineHintText();
    }

    function cancelBsplineDrawing() {
      bsplineMode = false;
      bsplinePoints = [];
      if (bsplineDraftLayer) { map.removeLayer(bsplineDraftLayer); bsplineDraftLayer = null; }
      document.getElementById('bsplineHint').classList.remove('visible');
    }

    function updateBsplineHintText() {
      const el = document.getElementById('bsplineHintText');
      if (!el) return;
      if (bsplinePoints.length < BSPLINE_MIN_POINTS) {
        el.textContent = `Klik peta untuk menambah titik (${bsplinePoints.length} titik, minimal ${BSPLINE_MIN_POINTS}).`;
      } else {
        el.textContent = `Klik titik awal lagi untuk menutup area, atau klik terus menambah titik (${bsplinePoints.length} titik).`;
      }
    }

    function handleBsplineMapClick(e) {
      // Kalau sudah ada >= 3 titik dan klik ini dekat dengan titik AWAL
      // (dalam toleransi piksel layar, bukan jarak geografis, supaya
      // konsisten di semua level zoom), tutup area di sini.
      if (bsplinePoints.length >= BSPLINE_MIN_POINTS) {
        const startPoint = map.latLngToContainerPoint(L.latLng(bsplinePoints[0].lat, bsplinePoints[0].lng));
        const clickPoint = e.containerPoint;
        const dx = startPoint.x - clickPoint.x;
        const dy = startPoint.y - clickPoint.y;
        if (Math.sqrt(dx * dx + dy * dy) <= BSPLINE_CLOSE_TOLERANCE_PX) {
          finishBsplineArea();
          return;
        }
      }

      bsplinePoints.push({ lat: e.latlng.lat, lng: e.latlng.lng });
      redrawBsplineDraft();
      updateBsplineHintText();
    }

    function redrawBsplineDraft() {
      bsplineDraftLayer.clearLayers();

      // Titik kontrol: titik pertama dibedakan warnanya sebagai penanda
      // "klik di sini lagi untuk menutup area".
      bsplinePoints.forEach((p, idx) => {
        L.circleMarker([p.lat, p.lng], {
          radius: idx === 0 ? 7 : 5,
          color: '#fff',
          weight: 2,
          fillColor: idx === 0 ? '#dc2626' : '#4f46e5',
          fillOpacity: 1
        }).addTo(bsplineDraftLayer);
      });

      // Garis guide putus-putus lurus antar titik, murni bantuan visual
      // urutan klik -- bentuk melengkung finalnya baru muncul saat area
      // ditutup (lihat finishBsplineArea).
      if (bsplinePoints.length >= 2) {
        L.polyline(bsplinePoints.map(p => [p.lat, p.lng]), {
          color: '#4f46e5',
          weight: 2,
          dashArray: '6,6',
          opacity: 0.8
        }).addTo(bsplineDraftLayer);
      }
    }

    // Titik pada kurva B-spline kubik seragam untuk 4 titik kontrol
    // p0..p3, pada parameter t (0..1), memakai basis fungsi B-spline
    // standar (bukan Catmull-Rom) -- kurva ini TIDAK melewati titik
    // kontrolnya persis, tapi selalu mulus (C2 continuous) dan tetap
    // "ditarik" ke arah tiap titik, cocok untuk penanda area bebas.
    function bsplineSegmentPoint(p0, p1, p2, p3, t) {
      const t2 = t * t, t3 = t2 * t;
      const b0 = (-t3 + 3 * t2 - 3 * t + 1) / 6;
      const b1 = (3 * t3 - 6 * t2 + 4) / 6;
      const b2 = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6;
      const b3 = t3 / 6;
      return {
        lat: p0.lat * b0 + p1.lat * b1 + p2.lat * b2 + p3.lat * b3,
        lng: p0.lng * b0 + p1.lng * b1 + p2.lng * b2 + p3.lng * b3
      };
    }

    // Bangun kurva B-spline closed-loop dari array titik kontrol -- titik
    // kontrol dianggap melingkar (indeks terakhir tersambung ke indeks 0)
    // supaya kurva menutup balik ke area sekitar titik awal (poin A).
    function computeClosedBspline(points, segmentsPerSpan = 16) {
      const n = points.length;
      if (n < 3) return points.slice();
      const curve = [];
      for (let i = 0; i < n; i++) {
        const p0 = points[(i - 1 + n) % n];
        const p1 = points[i % n];
        const p2 = points[(i + 1) % n];
        const p3 = points[(i + 2) % n];
        for (let s = 0; s < segmentsPerSpan; s++) {
          curve.push(bsplineSegmentPoint(p0, p1, p2, p3, s / segmentsPerSpan));
        }
      }
      return curve;
    }

    // Hitung luas polygon (km²) secara geodesic (memperhitungkan lengkungan
    // bumi sungguhan) memakai Turf.js -- turf.area() menghitung luas
    // permukaan bumi yang sebenarnya dari sebuah polygon GeoJSON, lebih
    // akurat dibanding pendekatan proyeksi datar untuk area yang lebih
    // luas. Hasilnya dalam m², dikonversi ke km² di sini.
    function computePolygonAreaKm2(points) {
      // GeoJSON polygon butuh urutan [lng, lat] (bukan [lat, lng]) dan
      // ring harus tertutup: titik pertama diulang di akhir array.
      const ring = points.map(p => [p.lng, p.lat]);
      ring.push(ring[0]);
      const turfPolygon = turf.polygon([ring]);
      const areaM2 = turf.area(turfPolygon);
      return areaM2 / 1_000_000;
    }

    function finishBsplineArea() {
      if (bsplinePoints.length < BSPLINE_MIN_POINTS) {
        cancelBsplineDrawing();
        return;
      }

      // Dulu di sini area digambar sebagai kurva B-spline (melengkung)
      // lewat computeClosedBspline(). Sekarang sengaja diganti jadi garis
      // lurus antar titik kontrol saja (fungsi B-spline-nya tetap ada di
      // kode, cuma tidak dipakai untuk MENGGAMBAR lagi) -- polygon
      // langsung dibentuk dari bsplinePoints apa adanya.
      if (bsplineAreaLayer) { map.removeLayer(bsplineAreaLayer); bsplineAreaLayer = null; }

      bsplineAreaLayer = L.polygon(bsplinePoints.map(p => [p.lat, p.lng]), {
        color: '#4f46e5',
        weight: 2.5,
        fillColor: '#4f46e5',
        fillOpacity: 0.18
      }).addTo(map);

      // Centroid sederhana (rata-rata titik kontrol asli, bukan titik
      // kurva) dipakai sebagai lokasi tujuan tombol Google Maps --
      // cukup representatif untuk area kecil/menengah hasil gambar tangan.
      const centroid = bsplinePoints.reduce(
        (acc, p) => ({ lat: acc.lat + p.lat / bsplinePoints.length, lng: acc.lng + p.lng / bsplinePoints.length }),
        { lat: 0, lng: 0 }
      );

      // Format URL "search/<keyword>/@lat,lng,zoom" (bukan yang pakai
      // ?api=1&query=) dipilih dengan sengaja: format api=1&query hanya
      // bisa dipakai untuk 1 nilai (titik ATAU kata kunci teks, tidak
      // dua-duanya sekaligus) sehingga tidak bisa mengarahkan sekaligus
      // mencari kata kunci di sekitar titik tertentu. Format @lat,lng,zoom
      // ini yang dipakai Google Maps sendiri saat searching sambil center
      // di lokasi tertentu, jadi hasilnya benar-benar pencarian "toko
      // bangunan" di sekitar area yang digambar, bukan cuma buka titiknya.
      const gmapsKeyword = 'toko bangunan';
      const gmapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(gmapsKeyword)}/@${centroid.lat},${centroid.lng},16z`;

      const areaKm2 = computePolygonAreaKm2(bsplinePoints);

      const popupHtml = `
        <div style="min-width:180px;">
          <b>Area yang digambar</b><br>
          <span style="color:var(--ink-soft);">Luas ~${areaKm2.toFixed(2)} km²</span>
          <button type="button" class="bspline-popup-btn" onclick="window.open('${gmapsUrl}', '_blank')">
            🔍 Cari "toko bangunan" di sini
          </button>
        </div>
      `;
      // autoClose:false & closeOnClick:false supaya popup ini TIDAK ikut
      // tertutup kalau user klik bagian lain di peta atau buka popup lain
      // (mis. popup toko) -- popup area cuma tertutup lewat tombol "✕"
      // bawaan Leaflet di pojok kanan-atasnya sendiri. Event 'popupclose'
      // di bawah menangkap momen tombol "✕" itu diklik, lalu ikut
      // menghapus polygon area-nya juga (bukan cuma menyembunyikan popup).
      bsplineAreaLayer
        .bindPopup(popupHtml, { autoClose: false, closeOnClick: false })
        .on('popupclose', closeBsplineArea)
        .openPopup(L.latLng(centroid.lat, centroid.lng));

      cancelBsplineDrawing();
    }

    // Dipanggil dari tombol "✕" di popup area -- menghapus polygon area
    // yang sedang tergambar dari peta (menutup popup-nya sekaligus,
    // karena popup itu menempel ke layer polygon ini).
    function closeBsplineArea() {
      if (bsplineAreaLayer) {
        map.removeLayer(bsplineAreaLayer);
        bsplineAreaLayer = null;
      }
    }

    async function loadData() {
      const overlay = document.getElementById('loadingOverlay');
      const progressBar = document.getElementById('progress');
      const loadingText = document.getElementById('loadingText');

      overlay.style.display = 'flex';

      let progress = 0;
      const progressInterval = setInterval(() => {
        progress += 22 + Math.random() * 18;
        if (progress > 95) progress = 95;
        progressBar.style.width = progress + '%';
      }, 65);

      try {
        // Pakai localStorage (bukan sessionStorage) supaya data tetap ada
        // walau halaman benar-benar tertutup (misal karena tidak sengaja
        // tekan back) dan dibuka lagi — tidak perlu fetch ulang dari nol.
        // Dikasih masa berlaku supaya datanya tidak jadi basi selamanya.
        const CACHE_MAX_AGE = 30 * 60 * 1000; // 30 menit
        const cacheRaw = localStorage.getItem('nsiData');
        const cacheTime = parseInt(localStorage.getItem('nsiDataTime') || '0', 10);
        const cacheMasihValid = cacheRaw && (Date.now() - cacheTime < CACHE_MAX_AGE);

        if (cacheMasihValid) {
          allData = JSON.parse(cacheRaw);
        } else {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 detik
          const res = await fetch(
            "https://script.google.com/macros/s/AKfycbw6VkzkHTAhyCGlmEBK_WaSO3DVzJGF3Vl95k8MTCtDIsa_zsZ1C0FBHAte74Lj7EEb2Q/exec",
            { signal: controller.signal }
          );
          clearTimeout(timeoutId);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          allData = await res.json();
          if (!Array.isArray(allData)) throw new Error('Format data tidak valid');
          localStorage.setItem('nsiData', JSON.stringify(allData));
          localStorage.setItem('nsiDataTime', String(Date.now()));
        }

        // Bangun daftar produk secara dinamis dari data, sebagai tambahan
        // terhadap daftar bawaan, supaya produk baru di sheet otomatis muncul.
        const produkDariData = new Set(
          allData.map(r => (r.produk || '').trim()).filter(Boolean)
        );
        produkDariData.forEach(p => {
          if (!productList.includes(p)) productList.push(p);
        });
        productList.sort((a, b) => a.localeCompare(b, 'id'));

        // Daftar nama toko unik, dipakai untuk autocomplete saat user
        // mengetik nama toko (bukan cuma nama produk).
        storeList = Array.from(new Set(
          allData.map(r => (r.pelanggan || '').trim()).filter(Boolean)
        )).sort((a, b) => a.localeCompare(b, 'id'));

        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        loadingText.textContent = "Data siap ✅";

        setTimeout(() => {
          overlay.style.display = 'none';
          // Tampilkan daftar default (sesuai chip aktif) sejak awal, di
          // mobile maupun desktop, supaya panel hasil tidak pernah terlihat
          // kosong/terpisah sebelum user tap search.
          renderDefaultView();
          showDragHintOnce();
        }, 280);
      } catch (e) {
        clearInterval(progressInterval);
        const pesan = e.name === 'AbortError'
          ? 'Waktu memuat data habis (koneksi lambat)'
          : 'Gagal memuat data';
        loadingText.innerHTML = pesan + "<br><button onclick=\"loadData()\">Coba lagi</button>";
      }
    }

    // Kotak pencarian dianggap "kosong" (tidak ada pencarian/filter aktif)
    // kalau teksnya kosong DAN tidak ada produk yang sudah dipilih sebagai
    // chip filter. Dalam kondisi ini, chip Produk/Toko yang menentukan
    // tampilan default.
    function isSearchEmpty() {
      const keyword = document.getElementById('search').value.trim();
      return keyword.length === 0 && selectedProducts.size === 0;
    }

    // Dipanggil saat kotak pencarian kosong: tampilan default sesuai chip
    // yang user pilih. Jika belum memilih chip (chipMode null) → sheet hidden.
    function renderDefaultView() {
      if (chipMode === 'toko') {
        tampilkanSemuaToko();
      } else if (chipMode === 'produk') {
        showProductCatalog();
      } else {
        // Belum pilih mode: bersihkan list, sembunyikan sheet, marker tetap
        currentMode = 'none';
        currentStores = [];
        lastSummaryStores = [];
        lastSummaryLabel = null;
        if (markerLayer) markerLayer.clearLayers();
        document.getElementById('results').innerHTML = '';
        document.getElementById('resultCount').textContent = '';
        document.getElementById('resultHeaderRow').style.display = 'none';
        updateCitySummary([], null);
        autoOpenSheet(false);
        updateFeatureButtonState();
      }
    }

    // Tampilan default chip "Produk": seluruh daftar produk A-Z.
    // forceOpen=true saat user menekan chip Produk (buka sheet meski search kosong).
    function showProductCatalog(forceOpen) {
      try {
        const resultsDiv = document.getElementById('results');
        currentMode = 'none';
        currentStores = [];
        lastSummaryStores = [];
        lastSummaryLabel = null;
        if (markerLayer) markerLayer.clearLayers();
        document.getElementById('resultCount').textContent = '';
        document.getElementById('resultHeaderRow').style.display = 'none';
        updateCitySummary([], null);

        const list = productList.filter(p => !selectedProducts.has(p));
        let html = '';
        if (!list.length) {
          html = `<div class="empty-state">Tidak ada produk lain</div>`;
        } else {
          list.forEach(prod => {
            // data-produk + event delegation (aman dari karakter khusus di nama produk)
            html += `<div class="suggestion-item" data-produk="${escapeHtml(prod)}">🎨 ${escapeHtml(prod)}</div>`;
          });
        }
        // Pastikan list tidak tertahan display:none dari mode ringkasan
        resultsDiv.style.display = '';
        resultsDiv.innerHTML = html;
        autoOpenSheet(list.length > 0, !!forceOpen);
        updateFeatureButtonState();
        applyCitySummaryListVisibility();
      } catch (err) {
        console.error('showProductCatalog error:', err);
      }
    }

    // Switch chip Produk/Toko (user harus memilih sendiri — tidak ada default):
    // - Produk → daftar nama produk di sheet
    // - Toko  → semua toko di sheet
    function switchChipMode(mode) {
      try {
        // Toggle: tekan chip yang sama lagi → batalkan pilihan
        if (chipMode === mode) {
          chipMode = null;
          document.getElementById('modeChipProduk').classList.remove('active');
          document.getElementById('modeChipToko').classList.remove('active');
          if (isSearchEmpty()) {
            renderDefaultView(); // sheet kembali hidden
          } else {
            cariProduk();
          }
          updateModeChipsVisibility();
          return;
        }

        chipMode = mode;
        document.getElementById('modeChipProduk').classList.toggle('active', mode === 'produk');
        document.getElementById('modeChipToko').classList.toggle('active', mode === 'toko');

        if (isSearchEmpty()) {
          if (mode === 'toko') {
            tampilkanSemuaToko(true);
          } else {
            showProductCatalog(true);
          }
        } else {
          cariProduk();
        }
        updateModeChipsVisibility();
      } catch (err) {
        console.error('switchChipMode error:', err);
        try {
          updateModeChipsVisibility();
          updateFeatureButtonState();
        } catch (e2) {}
      }
    }

    // Selecting a suggestion adds it as a chip (multi-select) instead of
    // replacing the typed text, so more than one product can be searched at once.
    function selectProduct(produk) {
      selectedProducts.add(produk);
      renderChips();
      const searchInput = document.getElementById('search');
      searchInput.value = '';
      cariProduk();
      updateModeChipsVisibility();
      // Setelah pilih produk dari daftar, tutup keyboard otomatis
      closeKeyboard();
    }

    function removeProduct(produk) {
      selectedProducts.delete(produk);
      renderChips();
      cariProduk();
      updateModeChipsVisibility();
    }

    function renderChips() {
      const chipsDiv = document.getElementById('chips');
      let html = '';
      selectedProducts.forEach(p => {
        // data-produk + event delegation (aman dari karakter khusus / apostrof di nama produk)
        html += `<span class="chip">${escapeHtml(p)}<span class="remove" data-produk="${escapeHtml(p)}" aria-label="Hapus ${escapeHtml(p)}"><svg class="icon-svg icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></span></span>`;
      });
      chipsDiv.innerHTML = html;
      document.getElementById('clearChipsBtn').style.display = selectedProducts.size ? 'flex' : 'none';
    }

    function clearAllChips() {
      selectedProducts.clear();
      renderChips();
      cariProduk();
      updateModeChipsVisibility();
    }

    function cariProduk() {
      try {
        const keyword = document.getElementById('search').value.toLowerCase().trim();
        const chips = Array.from(selectedProducts).map(p => p.toLowerCase());

        if (!chips.length && !keyword) {
          // Tidak ada filter/teks aktif -> tampilkan default sesuai chip
          // Produk/Toko yang sedang aktif (link "lihat semua toko" lama sudah
          // digantikan oleh chip Toko).
          renderDefaultView();
          return;
        }

        currentMode = 'search';

        // Saran nama produk yang cocok dengan ketikan — ini berlaku untuk
        // SEMUA kondisi, tidak bergantung chip Produk/Toko mana yang sedang
        // aktif, supaya user yang mengetik "COLORTONE" tetap melihat saran
        // produk itu walau sedang di mode Toko.
        const produkSuggestions = keyword
          ? productList.filter(p => !selectedProducts.has(p) && p.toLowerCase().includes(keyword)).slice(0, 8)
          : [];

        // Group matches by store instead of by row, so a store that carries
        // more than one matching product shows up once with all its products listed.
        const groups = new Map();

        allData.forEach(row => {
          const namaToko = (row.pelanggan || '').toLowerCase();
          const namaProduk = (row.produk || '').toLowerCase();

          // Exact match for chips: a chip is a specific product from the list, so
          // "SPECTRUM" must not also match "SPECTRUM AEROSOL" or "WP SPECTRUM".
          const matchChips = chips.length > 0 && chips.some(c => namaProduk === c);
          const matchKeyword = keyword.length > 0 && (namaToko.includes(keyword) || namaProduk.includes(keyword));

          if (matchChips || matchKeyword) {
            // Prefer a store code if the data has one; otherwise fall back to
            // name + address, which together uniquely identify the same store.
            const key = row.kode ? ('kode:' + String(row.kode).toLowerCase())
              : (namaToko + '|' + (row.alamat || '').toLowerCase());

            if (!groups.has(key)) {
              groups.set(key, {
                pelanggan: row.pelanggan,
                alamat: row.alamat,
                latitude: row.latitude,
                longitude: row.longitude,
                produkSet: new Set()
              });
            }
            if (row.produk) groups.get(key).produkSet.add(row.produk);
          }
        });

        // Label konteks untuk kartu ringkasan per kota, mengikuti filter yang
        // sedang aktif (chip produk dan/atau kata kunci ketikan).
        let summaryLabel;
        if (chips.length && keyword) {
          summaryLabel = `Produk: ${Array.from(selectedProducts).join(', ')} · Pencarian: "${document.getElementById('search').value.trim()}"`;
        } else if (chips.length) {
          summaryLabel = `Produk: ${Array.from(selectedProducts).join(', ')}`;
        } else {
          summaryLabel = `Pencarian: "${document.getElementById('search').value.trim()}"`;
        }

        renderStoreList(groups, {
          allMode: false,
          emptyHtml: 'Tidak ditemukan hasil',
          produkSuggestions,
          summaryLabel
        });
      } catch (err) {
        console.error('cariProduk error:', err);
        try {
          document.getElementById('results').innerHTML = `<div class="empty-state">Terjadi kesalahan saat mencari. Tekan tombol tutup untuk reset.</div>`;
          currentStores = [];
          updateFeatureButtonState();
        } catch (e2) {}
      }
    }

    // Menampilkan seluruh toko di data tanpa perlu mengetik apa pun — supaya
    // user bisa lihat dulu sebaran tokonya sebelum mencari sesuatu yang spesifik.
    // forceOpen=true saat user menekan chip Toko (buka sheet meski search kosong).
    function tampilkanSemuaToko(forceOpen) {
      try {
        currentMode = 'all';

        const groups = new Map();
        allData.forEach(row => {
          const namaToko = (row.pelanggan || '').toLowerCase();
          const key = row.kode ? ('kode:' + String(row.kode).toLowerCase())
            : (namaToko + '|' + (row.alamat || '').toLowerCase());
          if (!groups.has(key)) {
            groups.set(key, {
              pelanggan: row.pelanggan,
              alamat: row.alamat,
              latitude: row.latitude,
              longitude: row.longitude,
              produkSet: new Set()
            });
          }
          if (row.produk) groups.get(key).produkSet.add(row.produk);
        });

        renderStoreList(groups, {
          allMode: true,
          emptyHtml: 'Belum ada data toko',
          summaryLabel: 'Semua Toko',
          forceOpen: !!forceOpen
        });
      } catch (err) {
        console.error('tampilkanSemuaToko error:', err);
      }
    }

    // Fungsi bersama: mengurutkan alfabetis (A-Z), merender daftar + marker cluster.
    // Membuat isi popup satu toko. Dipisah jadi fungsi sendiri supaya bisa
    // dipakai ulang oleh renderVisibleMarkers() setiap kali sebuah titik
    // baru masuk ke area peta yang terlihat.
    function buildPopupHtml(store) {
      return `<b>${store.namaAman}</b><br>${store.alamatAman}<br>${store.produkAman}<br><button class="popup-nav-btn" onclick="window.open('https://www.google.com/maps?q=${store.lat},${store.lng}','_blank')">➡ Navigasi Google Maps</button>`;
    }

    // Viewport culling: dipanggil tiap kali peta selesai digeser/di-zoom
    // (lihat listener 'moveend zoomend' di initMap()) dan juga langsung
    // setelah renderStoreList() mengisi currentStores. Hanya toko yang
    // titiknya berada dalam area peta saat ini (+ buffer 30% supaya tidak
    // "kedip" muncul belakangan saat digeser) yang benar-benar dibuatkan
    // marker dan ditambahkan ke peta — daftar di panel tetap menampilkan
    // SEMUA toko hasil filter, cuma titik di peta yang dibatasi.
    //
    // Marker yang sudah pernah dibuat (store.marker) dipakai ulang, tidak
    // dibuat ulang tiap render, supaya tetap murah dipanggil berkali-kali
    // saat user menggeser peta.
    function renderVisibleMarkers() {
      try {
        if (!markerLayer || !map) return;
        if (!currentStores.length) {
          markerLayer.clearLayers();
          return;
        }

        // Update selektif (bukan clearLayers() + rebuild total): marker
        // yang sudah ada & masih di dalam viewport TIDAK disentuh sama
        // sekali. Ini penting supaya toko yang popup-nya sedang terbuka
        // (habis diklik dari list) tidak ikut hilang setiap kali peta
        // digeser/di-zoom — clearLayers() lama akan menutup paksa popup
        // yang sedang terbuka walau tokonya masih kelihatan di layar.
        const viewBounds = map.getBounds().pad(0.3);
        currentStores.forEach(store => {
          const inView = viewBounds.contains([store.lat, store.lng]);
          if (inView) {
            if (!store.marker) {
              store.marker = L.circleMarker([store.lat, store.lng], {
                radius: 7,
                weight: 2,
                color: '#ffffff',
                fillColor: '#4f46e5',
                fillOpacity: 1
              }).bindPopup(buildPopupHtml(store));
            }
            if (!markerLayer.hasLayer(store.marker)) {
              markerLayer.addLayer(store.marker);
            }
          } else if (store.marker && markerLayer.hasLayer(store.marker)) {
            // Jangan lepas marker yang popup-nya sedang terbuka, walau
            // sudah keluar viewport (mis. user zoom out sedikit) — biarkan
            // tetap ada sampai popup-nya ditutup sendiri oleh user.
            if (!store.marker.isPopupOpen()) {
              markerLayer.removeLayer(store.marker);
            }
          }
        });
      } catch (err) {
        console.error('renderVisibleMarkers error:', err);
      }
    }

    function renderStoreList(groups, opts) {
      try {
        const resultsDiv = document.getElementById('results');
        if (!resultsDiv) return;
        const bounds = L.latLngBounds([]);

        let storesArr = Array.from(groups.values()).map(store => {
          const lat = parseFloat(store.latitude);
          const lng = parseFloat(store.longitude);
          const valid = isFinite(lat) && isFinite(lng);
          return { ...store, lat, lng, valid };
        });

        storesArr.sort((a, b) =>
          (a.pelanggan || '').localeCompare(b.pelanggan || '', 'id', { sensitivity: 'base' })
        );

        let html = '';
        let skipped = 0;
        // Bersihkan marker lama sebelum reassign (cegah leak setelah ratusan search)
        if (currentStores && currentStores.length) {
          currentStores.forEach(s => { if (s.marker) { try { markerLayer.removeLayer(s.marker); } catch(e){} s.marker = null; } });
        }
        currentStores = [];

        storesArr.forEach(store => {
          // Lewati toko dengan koordinat kosong/rusak alih-alih membuat marker
          // di posisi NaN yang bisa membuat Leaflet error atau marker hilang.
          if (!store.valid) { skipped++; return; }

          const produkText = Array.from(store.produkSet).join(', ');
          const idx = currentStores.length;
          const namaAman = escapeHtml(store.pelanggan);
          const alamatAman = escapeHtml(store.alamat);
          const produkAman = escapeHtml(produkText);

          html += `
            <div class="toko-item" data-idx="${idx}">
              <div class="row">
                <span style="font-size:18px;">🏪</span>
                <span class="title">${namaAman}</span>
              </div>
              <div class="addr">${alamatAman}</div>
              <div class="prod">🎨 ${produkAman}</div>
            </div>`;

          // marker: null dulu — baru dibuat oleh renderVisibleMarkers() saat
          // titik ini kebetulan masuk area peta yang terlihat (lazy).
          currentStores.push({
            lat: store.lat, lng: store.lng,
            namaAman, alamatAman, produkAman,
            marker: null
          });
          bounds.extend([store.lat, store.lng]);
        });

        const total = currentStores.length;
        let label = '';
        if (total > 0) {
          label = opts.allMode
            ? `Menampilkan semua ${total} toko`
            : `${total} toko ditemukan`;
          if (skipped) label += ` (${skipped} tanpa koordinat valid dilewati)`;
        }

        // Saran nama produk yang cocok (kalau ada) ditampilkan di ATAS daftar
        // toko — muncul terlepas dari chip Produk/Toko mana yang sedang aktif,
        // karena kolom pencarian berlaku untuk semua, bukan cuma toko.
        let suggestionHtml = '';
        const produkSuggestions = opts.produkSuggestions || [];
        if (produkSuggestions.length) {
          suggestionHtml += `<div class="suggestion-group-label">Produk</div>`;
          produkSuggestions.forEach(prod => {
            suggestionHtml += `<div class="suggestion-item" data-produk="${escapeHtml(prod)}">🎨 ${escapeHtml(prod)}</div>`;
          });
          if (total > 0) suggestionHtml += `<div class="suggestion-group-label">Toko</div>`;
        }

        const bodyHtml = total > 0
          ? html
          : (produkSuggestions.length ? '' : `<div class="empty-state">${opts.emptyHtml || 'Tidak ditemukan hasil'}</div>`);

        document.getElementById('resultCount').textContent = label;
        document.getElementById('resultHeaderRow').style.display = total ? 'flex' : 'none';
        // Reset display dulu supaya list tidak nyangkut display:none dari mode ringkasan
        resultsDiv.style.display = '';
        resultsDiv.innerHTML = suggestionHtml + bodyHtml;
        autoOpenSheet(total > 0 || produkSuggestions.length > 0, !!opts.forceOpen);
        if (total > 0 || produkSuggestions.length > 0) expandListIfCollapsed();

        if (total > 0 && map) {
          // maxZoom dibatasi supaya saat hasil pencarian cuma 1 toko (bounds-nya
          // nyaris sebuah titik), peta tidak auto zoom sampai level jalan/gedung
          // yang terlalu dekat — cukup sampai level lingkungan sekitar.
          try { map.fitBounds(bounds.pad(0.15), { maxZoom: 16 }); } catch (e) { console.warn('fitBounds', e); }
        }
        // Render langsung untuk viewport saat ini (baik total>0 atau 0, supaya
        // marker lama ikut dibersihkan). fitBounds di atas juga akan memicu
        // event 'moveend'/'zoomend' yang sudah didengarkan di initMap() untuk
        // merender ulang begitu animasi peta selesai berpindah.
        renderVisibleMarkers();

        const validForSummary = storesArr.filter(s => s.valid);
        lastSummaryStores = validForSummary;
        lastSummaryLabel = opts.summaryLabel || null;
        updateCitySummary(validForSummary, opts.summaryLabel);
        updateFeatureButtonState();
        // Jika Ringkasan per Kota aktif, list toko tetap disembunyikan
        applyCitySummaryListVisibility();
      } catch (err) {
        console.error('renderStoreList error:', err);
        // Recover UI supaya tombol tidak mati total
        try {
          document.getElementById('results').innerHTML = `<div class="empty-state">Terjadi kesalahan saat menampilkan hasil. Coba reset atau cari ulang.</div>`;
          currentStores = [];
          lastSummaryStores = [];
          lastSummaryLabel = null;
          updateFeatureButtonState();
        } catch (e2) {}
      }
    }

    function focusMarker(idx) {
      try {
        setSheetState('collapsed');
        const store = currentStores[idx];
        if (!store || !map) return;
        // Cegah render viewport-culling otomatis (debounced) menutup
        // popup yang akan dibuka manual di bawah — lihat komentar di
        // deklarasi suppressAutoViewportRender.
        suppressAutoViewportRender = true;
        // Pindah + zoom peta ke lokasi toko dengan level zoom TETAP (tidak
        // tergantung zoom saat ini) — supaya toko selalu kelihatan jelas
        // walau sebelumnya peta masih zoom out (tampilan semua toko), tapi
        // levelnya dijaga cukup renggang (bukan level jalan/gedung).
        const FOCUS_ZOOM = 12;
        // Listener dipasang SEBELUM peta dipindah — setView tanpa animasi
        // memicu 'moveend' secara instan/sinkron, jadi kalau listener baru
        // dipasang sesudahnya, eventnya bisa terlewat sama sekali.
        map.once('moveend', () => {
          try {
            // Setelah peta selesai berpindah, area tujuan otomatis masuk
            // viewport — render ulang supaya marker toko ini pasti sudah
            // ada sebelum popup-nya dibuka.
            renderVisibleMarkers();
            if (store.marker) store.marker.openPopup();
          } catch (e) { console.error('focusMarker moveend', e); }
        });
        if (map.getZoom() === FOCUS_ZOOM) {
          // Zoom sudah pas → geser murni tanpa animasi zoom sama sekali,
          // supaya titik toko (dirender di <canvas>, lihat initMap) tidak
          // ikut ter-skala/berubah ukuran selama transisi.
          map.panTo([store.lat, store.lng]);
        } else {
          map.setView([store.lat, store.lng], FOCUS_ZOOM, { animate: true });
        }
      } catch (err) {
        console.error('focusMarker error:', err);
      }
    }

    // ---- Mobile bottom sheet (draggable results panel) ----
    const resultsCard = document.getElementById('resultsCard');
    const sheetHeader = document.getElementById('sheetHeader');
    const MOBILE_QUERY = '(max-width: 768px)';
    let sheetState = 'hidden'; // 'hidden' | 'collapsed' | 'mid' | 'full'
                               // 'hidden' = sheet benar-benar hilang (halaman utama)
                               // 'mid' ≈ 80% layar — default saat ada hasil pencarian
                               // 'full' hanya lewat geser/tap user
    let sheetTranslate = 0;
    let dragStartY = 0;
    let dragStartTranslate = 0;
    let dragging = false;
    let dragMoved = false;

    function isMobile() {
      return window.matchMedia(MOBILE_QUERY).matches;
    }

    function getSnapOffsets() {
      // Pakai tinggi aktual sheet (~100dvh) supaya full menutupi search bar.
      const h = resultsCard.offsetHeight || window.innerHeight;
      // collapsed: handle + toolbar sedikit terlihat
      const collapsedVisible = 120;
      // mid = 80% layar terlihat (translate turun 20%)
      // full = 0 → menutupi hampir seluruh layar
      // hidden = sepenuhnya di luar layar (halaman utama)
      return {
        hidden: h + 20,
        collapsed: Math.max(0, h - collapsedVisible),
        mid: Math.round(h * 0.20),
        full: 0
      };
    }

    function applySheetTranslate(px, animate) {
      resultsCard.style.transition = animate ? 'transform 0.25s ease' : 'none';
      resultsCard.style.transform = `translateY(${px}px)`;
      sheetTranslate = px;
    }

    function setSheetState(state, animate) {
      try {
        sheetState = state;

        // Desktop: sheet BUKAN bottom-sheet yang di-translate keluar layar
        // (itu cuma perilaku mobile). Tanpa ini, di desktop sheet selalu
        // kelihatan (kotak putih kosong) walau belum ada pencarian sama
        // sekali. Jadi di sini sheet disembunyikan sungguhan lewat class
        // (display:none) saat state === 'hidden'.
        resultsCard.classList.toggle('sheet-hidden-desktop', state === 'hidden');

        // Tombol ⌃/⌄ (kecilkan/perbesar daftar) hanya relevan begitu ada
        // daftar toko untuk diatur — di halaman utama (state 'hidden',
        // belum ada pencarian) tombol ini disembunyikan.
        const appEl = document.querySelector('.app');
        if (appEl) appEl.classList.toggle('has-search-context', state !== 'hidden');

        if (!isMobile()) return;

        // Jika sedang drag, hentikan dulu supaya tidak bentrok dengan transform
        if (dragging && state === 'hidden') {
          dragging = false;
        }
        const offsets = getSnapOffsets();
        applySheetTranslate(offsets[state] !== undefined ? offsets[state] : offsets.hidden, animate !== false);
        // Saat full, hilangkan radius atas agar sheet full-screen menutupi search
        resultsCard.classList.toggle('sheet-full', state === 'full');
        // Saat hidden, nonaktifkan interaksi sheet
        resultsCard.style.pointerEvents = state === 'hidden' ? 'none' : 'auto';
        // Sinkronkan visibilitas chip Produk/Toko dengan status sheet
        if (typeof updateModeChipsVisibility === 'function') updateModeChipsVisibility();

        // Popover Analisis: tutup jika sheet hilang; re-posisi jika masih terbuka
        // (tombol Analisis ikut bergerak saat sheet di-snap)
        if (state === 'hidden') {
          closeFeaturePanel();
        } else if (featurePanelOpen) {
          requestAnimationFrame(positionFeaturePanel);
        }
      } catch (err) {
        console.error('setSheetState error:', err);
      }
    }

    function startDrag(e) {
      if (!isMobile()) return;
      if (dragging) {
        // Safety: jika drag sebelumnya stuck, paksa selesai dulu
        endDrag(e);
      }
      const t = e.target;
      if (!t || !t.closest) return;

      // JANGAN mulai drag jika user menekan tombol/kontrol interaktif
      // (Analisis, X, switch, label) — biarkan onclick/onchange berjalan normal.
      // Ini penyebab utama tombol reset & analisis "mati" setelah dipakai berkali-kali.
      if (t.closest('button') || t.closest('.switch') || t.closest('input') ||
          t.closest('label') || t.closest('.feature-row') || t.closest('.chip')) {
        return;
      }
      // Jangan drag dari area yang harus bisa di-scroll / diinteraksi
      if (t.closest('.city-summary-card') || t.closest('.feature-panel') || t.closest('#results')) {
        return;
      }

      // Izinkan drag dari SEMUA bagian sheet-header (handle, toolbar kosong, hint)
      // asalkan bukan kontrol di atas. Lebih andal & UX lebih baik.
      if (!t.closest('.sheet-header')) return;

      // Tutup popover saat user mulai drag sheet (tombol ikut bergerak)
      closeFeaturePanel();

      dragging = true;
      dragMoved = false;
      dragStartY = e.clientY;
      dragStartTranslate = sheetTranslate;
      resultsCard.style.transition = 'none';
      try {
        if (e.pointerId != null) sheetHeader.setPointerCapture(e.pointerId);
      } catch (err) {}
      // Juga dengarkan di document supaya pointerup di luar header tetap menangkap
      document.addEventListener('pointerup', endDrag, { once: true });
      document.addEventListener('pointercancel', endDrag, { once: true });
      dismissDragHint();
    }

    // Menampilkan hint (bounce + teks singkat) sekali saja seumur hidup
    // browser user, supaya orang yang belum pernah pakai Google Maps tahu
    // bahwa panel bawah ini bisa ditarik naik/turun.
    function showDragHintOnce() {
      if (!isMobile()) return;
      if (localStorage.getItem('sheetHintShown')) return;
      sheetHeader.classList.add('hint-bounce');
      document.getElementById('sheetHintText').style.display = 'block';
      setTimeout(dismissDragHint, 2600);
    }

    function dismissDragHint() {
      sheetHeader.classList.remove('hint-bounce');
      const hintText = document.getElementById('sheetHintText');
      if (hintText) hintText.style.display = 'none';
      localStorage.setItem('sheetHintShown', '1');
    }

    function duringDrag(e) {
      if (!dragging) return;
      try {
        const dy = e.clientY - dragStartY;
        if (Math.abs(dy) > 5) dragMoved = true;
        const offsets = getSnapOffsets();
        const next = Math.max(offsets.full, Math.min(offsets.collapsed, dragStartTranslate + dy));
        applySheetTranslate(next, false);
      } catch (err) {
        console.error('duringDrag error:', err);
        endDrag(e);
      }
    }

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      try {
        if (e && e.pointerId != null) {
          sheetHeader.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}

      try {
        if (!dragMoved) {
          // Tap pada handle/area header: siklus collapsed -> mid -> full -> collapsed.
          // (hidden tidak ikut siklus tap — hanya lewat reset/X/back)
          const urutan = { collapsed: 'mid', mid: 'full', full: 'collapsed' };
          setSheetState(urutan[sheetState] || 'mid');
          return;
        }

        // Snap ke titik terdekat (abaikan 'hidden' saat drag)
        const offsets = getSnapOffsets();
        let nearest = 'collapsed';
        let jarakTerdekat = Infinity;
        for (const state of ['collapsed', 'mid', 'full']) {
          const jarak = Math.abs(sheetTranslate - offsets[state]);
          if (jarak < jarakTerdekat) { jarakTerdekat = jarak; nearest = state; }
        }
        setSheetState(nearest);
      } catch (err) {
        console.error('endDrag error:', err);
        // Recover ke posisi aman
        try { setSheetState('mid'); } catch (e2) {}
      }
    }

    sheetHeader.addEventListener('pointerdown', startDrag);
    sheetHeader.addEventListener('pointermove', duringDrag);
    // pointerup/cancel juga di document (lihat startDrag) supaya tidak stuck
    // jika jari lepas di luar area header. Listener di sini sebagai backup.
    sheetHeader.addEventListener('pointerup', endDrag);
    sheetHeader.addEventListener('pointercancel', endDrag);

    function handleViewportChange() {
      if (isMobile()) {
        setSheetState(sheetState, false);
      } else {
        resultsCard.style.transform = '';
        resultsCard.style.transition = '';
      }
    }
    window.addEventListener('resize', handleViewportChange);

    const searchInput = document.getElementById('search');
    const controlsRow = document.querySelector('.controls-row');

    // Chip Produk/Toko: muncul saat fokus ke kotak cari, ada teks/chip aktif,
    // ATAU sheet sedang terbuka (user baru menekan chip Produk/Toko).
    // Hilang lagi di halaman utama (kotak kosong + sheet hidden).
    function updateModeChipsVisibility() {
      if (!controlsRow) return;
      const focused = document.activeElement === searchInput;
      const hasQuery = !isSearchEmpty();
      const sheetOpen = isMobile() && sheetState !== 'hidden';
      controlsRow.classList.toggle('visible', focused || hasQuery || sheetOpen);
    }

    searchInput.addEventListener('focus', updateModeChipsVisibility);
    searchInput.addEventListener('blur', () => {
      // Delay sedikit supaya klik pada chip tidak ketutup sebelum onclick jalan
      setTimeout(updateModeChipsVisibility, 150);
    });

    // Mengetik langsung menjalankan pencarian sungguhan (gabungan produk +
    // toko yang cocok) — di-debounce supaya tidak me-render ulang semua
    // marker di setiap ketukan tombol. Begitu kotak dikosongkan lagi,
    // cariProduk() otomatis kembali ke tampilan default sesuai chip aktif.
    let searchDebounceTimer = null;
    searchInput.addEventListener('input', () => {
      updateModeChipsVisibility();
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(cariProduk, 250);
    });

    // Menutup keyboard virtual (khususnya di Android WebView/Chrome).
    // blur() saja sering tidak cukup, jadi pakai beberapa trik berurutan:
    // 1) blur input, 2) fokus ke elemen dummy tersembunyi, 3) readonly
    // sementara (trik andal di banyak WebView Android).
    function closeKeyboard() {
      searchInput.blur();

      // Dummy input tersembunyi untuk "mencuri" fokus dari search box
      let dummy = document.getElementById('_kbCloser');
      if (!dummy) {
        dummy = document.createElement('input');
        dummy.id = '_kbCloser';
        dummy.setAttribute('readonly', 'readonly');
        dummy.setAttribute('tabindex', '-1');
        dummy.style.cssText = 'position:fixed;top:0;left:0;opacity:0;height:0;width:0;border:0;padding:0;margin:0;pointer-events:none;';
        document.body.appendChild(dummy);
      }
      dummy.focus();
      setTimeout(() => {
        dummy.blur();
        // Readonly sementara — sering berhasil memaksa keyboard tutup di Android
        searchInput.setAttribute('readonly', 'readonly');
        setTimeout(() => {
          searchInput.removeAttribute('readonly');
        }, 80);
      }, 30);
    }

    // Pressing Enter runs the search, closes the suggestion list, dan
    // menutup keyboard (blur) supaya user langsung lihat hasil tanpa
    // keyboard menutupi sebagian layar.
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(searchDebounceTimer);
        cariProduk();
        closeKeyboard();
      }
    });

    // Explicit search button, same result as pressing Enter — termasuk
    // menutup keyboard.
    document.getElementById('searchBtn').addEventListener('click', () => {
      clearTimeout(searchDebounceTimer);
      cariProduk();
      closeKeyboard();
    });

    document.getElementById('clearChipsBtn').addEventListener('click', clearAllChips);

    // ---- Antisipasi tombol/gesture back tidak sengaja ----
    // Trik umum di app Android: setiap kali kita "menempati" sebuah state
    // history, back tidak langsung keluar dari halaman. Ada 3 lapis, dari
    // state paling "dalam" ke halaman utama:
    // 1) Kalau bottom sheet masih terbuka (full/mid), back pertama menutup
    //    itu dulu (turun level sheet).
    // 2) Kalau masih ada pencarian/filter aktif (teks di kolom cari atau
    //    chip produk terpilih), back berikutnya membersihkan itu dan
    //    membawa user ke HALAMAN UTAMA (tampilan default) — bukan langsung
    //    menutup aplikasi.
    // 3) Baru di halaman utama (tanpa pencarian aktif, panel tertutup),
    //    back menampilkan popup konfirmasi "Keluar dari NSI Maps?" supaya
    //    user tidak keluar tidak sengaja lalu harus buka Chrome lagi.
    let isExiting = false;       // true setelah user konfirmasi keluar
    let exitModalOpen = false;

    // Kembali ke tampilan awal: kosongkan kolom cari & chip produk terpilih,
    // lalu tampilkan daftar default sesuai chip Produk/Toko yang aktif,
    // dengan panel tetap tertutup (bukan langsung terbuka penuh lagi).
    function kembaliKeHalamanUtama() {
      try {
        // Paksa hentikan drag yang mungkin stuck (penyebab tombol "mati")
        if (dragging) {
          dragging = false;
          try { resultsCard.style.transition = ''; } catch (e) {}
        }

        // Tutup panel Analisis
        closeFeaturePanel();

        // Reset SEMUA fitur Analisis
        features.citySummary = false;
        try { localStorage.setItem('nsiFeatures', JSON.stringify(features)); } catch (e) {}
        const toggleCity = document.getElementById('toggleCitySummary');
        if (toggleCity) toggleCity.checked = false;
        updateFeatureBadge();

        // Sembunyikan kartu ringkasan
        const cityCard = document.getElementById('citySummaryCard');
        if (cityCard) cityCard.style.display = 'none';
        try {
          if (markerLayer && map) {
            markerLayer.clearLayers();
            if (!map.hasLayer(markerLayer)) map.addLayer(markerLayer);
          }
        } catch (e) {}

        // Reset teks pencarian + chip produk + pilihan mode
        const searchEl = document.getElementById('search');
        if (searchEl) searchEl.value = '';
        selectedProducts.clear();
        renderChips();
        chipMode = null;
        const chipProduk = document.getElementById('modeChipProduk');
        const chipToko = document.getElementById('modeChipToko');
        if (chipProduk) chipProduk.classList.remove('active');
        if (chipToko) chipToko.classList.remove('active');

        // Pastikan list & tombol Analisis tidak tertahan state rusak
        const resultsDiv = document.getElementById('results');
        if (resultsDiv) {
          resultsDiv.style.display = '';
          resultsDiv.innerHTML = '';
        }
        expandListIfCollapsed();
        const sheetHeaderEl = document.getElementById('sheetHeader');
        if (sheetHeaderEl) sheetHeaderEl.classList.remove('summary-mode');
        const analisisBtn = document.getElementById('featureToggleBtn');
        if (analisisBtn) {
          analisisBtn.style.display = '';
          analisisBtn.disabled = false;
          analisisBtn.classList.remove('panel-open', 'has-active');
        }

        // Kembalikan peta ke posisi & zoom semula (tampilan awal), supaya
        // tidak nyangkut di lokasi/zoom hasil pencarian sebelumnya
        try {
          if (map) map.setView(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM, { animate: false });
        } catch (e) {}

        // Bersihkan currentStores agar tidak bawa marker lama
        if (currentStores && currentStores.length) {
          currentStores.forEach(s => { if (s.marker) s.marker = null; });
        }
        currentStores = [];
        lastSummaryStores = [];
        lastSummaryLabel = null;
        currentMode = 'none';

        renderDefaultView();
        setSheetState('hidden');
        updateModeChipsVisibility();
        updateFeatureButtonState();
      } catch (err) {
        console.error('kembaliKeHalamanUtama error:', err);
        // Fallback: minimal reset UI
        try {
          dragging = false;
          setSheetState('hidden');
          document.getElementById('search').value = '';
          selectedProducts.clear();
          renderChips();
        } catch (e2) {}
      }
    }

    function pushBackGuard() {
      history.pushState({ nsiGuard: true }, '', location.href);
    }

    function showExitModal() {
      const modal = document.getElementById('exitModal');
      if (!modal) return;
      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden', 'false');
      exitModalOpen = true;
      // Fokus ke tombol Batal (aman, mudah dibatalkan)
      const cancelBtn = document.getElementById('exitCancelBtn');
      if (cancelBtn) setTimeout(() => cancelBtn.focus(), 40);
    }

    function hideExitModal() {
      const modal = document.getElementById('exitModal');
      if (!modal) return;
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      exitModalOpen = false;
    }

    function confirmExit() {
      isExiting = true;
      hideExitModal();

      // Usaha menutup tab secara paksa.
      // Catatan: browser modern hanya mengizinkan window.close() jika tab
      // dibuka lewat script (window.open). Untuk tab yang dibuka manual,
      // kita pakai beberapa fallback agar user tetap bisa keluar.
      try {
        window.open('', '_self');
        window.close();
      } catch (e) {}

      // Fallback 1: kembali ke entry paling awal di history
      // (sering membuat Chrome/Android menutup tab kalau tidak ada lagi).
      try {
        if (history.length > 1) {
          history.go(-(history.length - 1));
        } else {
          history.back();
        }
      } catch (e) {
        history.back();
      }

      // Fallback 2: kalau masih di sini setelah sebentar, paksa ke about:blank
      setTimeout(() => {
        try {
          window.location.replace('about:blank');
        } catch (e) {}
      }, 150);
    }

    function cancelExit() {
      hideExitModal();
      // History sudah di-pushBackGuard saat modal dibuka, jadi tetap aman.
    }

    document.getElementById('exitCancelBtn').addEventListener('click', cancelExit);
    document.getElementById('exitConfirmBtn').addEventListener('click', confirmExit);
    document.getElementById('exitModalBackdrop').addEventListener('click', cancelExit);

    // Escape = batal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && exitModalOpen) {
        cancelExit();
      }
    });

    window.addEventListener('popstate', () => {
      // Sheet dianggap terbuka jika mid atau full (bukan hidden/collapsed)
      const sheetTerbuka = isMobile() && (sheetState === 'mid' || sheetState === 'full');
      const adaPencarianAktif = !isSearchEmpty();

      if (sheetTerbuka) {
        // Turun satu tingkat: full → mid → collapsed
        setSheetState(sheetState === 'full' ? 'mid' : 'collapsed');
        pushBackGuard();
        return;
      }

      if (adaPencarianAktif) {
        // Masih ada pencarian/chip aktif → reset ke halaman utama (sheet hidden)
        kembaliKeHalamanUtama();
        pushBackGuard();
        return;
      }

      // User sudah konfirmasi keluar → biarkan benar-benar meninggalkan halaman
      if (isExiting) {
        isExiting = false;
        return; // jangan pushBackGuard lagi
      }

      // Modal sudah terbuka + user tekan back lagi → anggap batal
      if (exitModalOpen) {
        hideExitModal();
        pushBackGuard();
        return;
      }

      // Halaman utama: tampilkan popup konfirmasi
      showExitModal();
      pushBackGuard();
    });

    // Event delegation: klik pada suggestion / toko-item / chip-remove.
    // Aman dari karakter khusus di nama produk, dan tetap bekerja setelah
    // innerHTML diganti berkali-kali (tidak perlu re-attach listener).
    document.getElementById('results').addEventListener('click', function(e) {
      const toko = e.target.closest('.toko-item');
      if (toko && toko.dataset.idx != null) {
        const idx = parseInt(toko.dataset.idx, 10);
        if (!isNaN(idx)) focusMarker(idx);
        return;
      }
      const sug = e.target.closest('.suggestion-item');
      if (sug && sug.dataset.produk) {
        selectProduct(sug.dataset.produk);
      }
    });

    document.getElementById('chips').addEventListener('click', function(e) {
      const rem = e.target.closest('.remove');
      if (rem && rem.dataset.produk) {
        e.stopPropagation();
        removeProduct(rem.dataset.produk);
      }
    });

    window.onload = () => {
      try {
        initMap();
        initFeatureToggles();
        loadData();
        handleViewportChange();
        pushBackGuard();
      } catch (err) {
        console.error('onload error:', err);
      }
    };
  </script>
</body>
</html>
